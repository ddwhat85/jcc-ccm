# JCC-CCM 펌웨어 설정 예시
# 실제 배포 시 이 파일을 config.toml 로 복사해 현장 값으로 채운다.
# 코드는 건드리지 않는다 — 현장마다 이 파일만 바꿔 굽는다.

[device]
# 이 CCM(게이트웨이)의 고유 ID. JCC 서버가 장비를 구분하는 키.
# 비워두면 CCM 호스트명(ccm-<시리얼>)을 자동으로 사용한다.
id = ""
site = "인터배터리 데모"          # 설치 현장 이름 (사람이 읽는 용도)

# ── 판넬 그룹 ──
# CCM 1대는 센서를 소수(윗면 RS485/CAN 1버스)만 수용하므로, 한 판넬을 여러 CCM이
# 나눠 감시한다. 같은 판넬의 CCM들은 아래 panel 값을 동일하게 맞춘다.
# 그러면 대시보드가 이들을 "판넬 1개"로 묶어 보여준다.
panel = "panel-01"
panel_name = "스마트 판넬"

[collection]
interval_seconds = 10             # 센서를 몇 초마다 읽어 보낼지
publish_batch = true              # true면 한 주기의 모든 센서를 한 번에 묶어 전송

[transport]
kind = "mqtt"                     # "mqtt" 또는 "http"

[transport.mqtt]
host = "mqtt.jcc-solution.example"
port = 8883
tls = true
username = ""
password = ""
# 발행 토픽. {device_id}는 실행 시 치환된다.
topic = "jcc/ccm/{device_id}/telemetry"
qos = 1

[transport.http]
# transport.kind = "http" 일 때만 사용
url = "https://api.jcc-solution.example/v1/telemetry"
api_key = ""
timeout_seconds = 10

# ── 내장 센서 (CCM 자체 제공: 온도·습도·도어거리) ──
[[sensors]]
key = "cabinet_temp"
name = "함내 온도"
driver = "ambient"               # /home/scripts/ambient_read.sh 사용
metric = "temp"
unit = "C"
enabled = true

[[sensors]]
key = "cabinet_humidity"
name = "함내 습도"
driver = "ambient"
metric = "hum"
unit = "%RH"
enabled = true

[[sensors]]
key = "door_distance"
name = "도어 개폐"
driver = "distance"              # /home/scripts/distance_read.sh 사용
unit = "mm"
enabled = true

# ── 외부 센서 (Banner 등, RS485 + Modbus RTU) ──
# BOM 기준 예시. 실제 슬레이브 주소·레지스터는 각 센서 데이터시트로 확정한다.
[[sensors]]
key = "h2_lel"
name = "수소 농도"
driver = "modbus"
unit = "%LEL"
enabled = false                  # 배선·레지스터 확정 후 true
modbus_slave = 1
modbus_register = 0
modbus_type = "input"            # input / holding
modbus_datatype = "uint16"
scale = 0.1                      # 원시값 → 실제값 환산 계수
offset = 0.0

[[sensors]]
key = "main_current"
name = "메인차단기 전류"
driver = "modbus"
unit = "A"
enabled = false
modbus_slave = 2
modbus_register = 0
modbus_type = "input"
modbus_datatype = "uint16"
scale = 0.01
offset = 0.0

# ── 엣지 예지 (화재 징조·결로 → 벤트·히터·팬) ──
# 켜면 이 CCM이 서버·인터넷 없이 직접 판정해 릴레이를 움직인다(서버와 같은 로직).
# roles에는 '이 CCM에 물린' 센서 key만 적는다. 없는 역할은 비워두면 그 알고리즘은
# 이 CCM에서 쉬고, 판넬 전체 판정은 서버가 여러 CCM 데이터를 모아서 한다.
#   가스 CCM: h2·voc → 화재 징조 → 벤트    /  환경 CCM: ambient·humidity → 결로 → 히터·팬
[predict]
enabled = false
autovent = true                   # false면 판정·보고만(벤트 자동 개방 안 함)
failsafe_after_seconds = 60       # 가스 센서가 이만큼 끊기면 벤트 fail-safe
# 접점 발열 기준(설치 초기 정상 기간에 학습) 저장 파일. 재부팅해도 기준이 유지돼야
# 그동안 서서히 풀린 접점이 '새 정상'으로 흡수되지 않는다. 접점 정비 후엔 대시보드에서 재학습.
# 같은 폴더의 tuning.json 에는 튜닝 콘솔에서 내려온 예지 기준(검증 통과분)이 저장된다.
# 서버 설정이 절대 한계(펌웨어 params.py — 서명된 OTA로만 바뀜) 밖이면 CCM이 거부하고 이전 기준을 쓴다.
state_file = "/opt/jcc-ccm/predict_state.json"

[predict.roles]
h2 = "h2_lel"
# voc = "voc_ppm"
# co = "co_ppm"                   # CO(일산화탄소) — 있으면 화재 지수에 세 번째 가스로 합류
# ambient = "cabinet_temp"
# humidity = "cabinet_humidity"
# current = "main_current"
# contact_temp = "ncontact_temp"

# 출력(릴레이). predict.enabled = true 일 때만 쓸 수 있다. 종류별 1개.
# driver = "modbus_coil": RS485 릴레이 모듈(센서와 같은 버스 공유) / "log": 로그만(시운전)
# ⚠ 배선: 벤트는 CCM 전원이 끊기면 '열리는' 쪽(NC 접점·스프링 리턴 댐퍼)으로.
#   소프트웨어 fail-safe는 가스 센서를 잃었을 때만 다루고, CCM 정전은 배선이 책임진다.
# [[actuators]]
# kind = "vent"                   # vent | heater | fan
# driver = "modbus_coil"
# modbus_slave = 10               # 릴레이 모듈 주소
# modbus_coil = 0                 # 코일(채널) 번호
# invert = false                  # 켜짐=코일 OFF로 배선했으면 true
# failsafe = "open"               # 벤트: open(기본) | hold
# ── 작동 확인: 명령대로 됐는지 되읽고, 안 되면 다시 시도, 끝내 안 되면 '작동 실패' 위험 경보 ──
# 권장 구성: 보조접점(위치 스위치) 달린 댐퍼 구동기 + 입력 단자 있는 Modbus 릴레이 모듈 → switch
# feedback = "switch"             # none | coil(릴레이 되읽기, modbus_coil 기본) | switch(실제 열림 확인)
# feedback_input = 0              # switch: 위치 스위치가 물린 모듈 입력 번호
# feedback_slave = -1             # switch: 스위치 모듈 주소(-1 = 릴레이와 같은 모듈)
# feedback_invert = false         # switch: 열림일 때 입력이 꺼지는 배선이면 true
# travel_seconds = 30             # 명령 후 이 시간 안에 맞아야 함(0 = 벤트 30·히터/팬 3)
# retries = 2                     # 안 맞으면 다시 써 보는 횟수
# check_every = 30                # 평소 되읽기 주기(모듈 재부팅으로 풀린 릴레이 감지)

[modbus]
# RS485 포트 설정 (CCM의 CAN/RS485 RJ45). 실기에서 장치 경로 확인 후 조정.
port = "/dev/ttyS1"
baudrate = 9600
parity = "N"                     # N / E / O
stopbits = 1
bytesize = 8
timeout_seconds = 1.0

[logging]
level = "INFO"                   # DEBUG / INFO / WARNING / ERROR
file = "/opt/jcc-ccm/jcc-ccm.log"

# ── 원격 업데이트(OTA) ─────────────────────────────────────
# JCC가 서명한 번들만 설치한다. public_key 는 오프라인 PC에서
#   python tools/ota_keygen.py <저장소 밖 경로>/jcc-ota.key
# 로 만든 뒤 출력되는 64자리 공개키를 넣는다(개인키는 절대 CCM·서버·저장소에 두지 않음).
# HTTP 전송에서만 동작한다. 서버 JCC_OTA_TARGET 에 이 CCM이 들어 있어야 제안이 온다.
# [ota]
# enabled = true
# public_key = "<64자리 hex 공개키>"
# base_dir = "/opt/jcc-ccm"
