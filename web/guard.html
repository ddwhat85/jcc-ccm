<!-- 이 파일은 tools/build_web.py 가 생성합니다. 직접 고치지 마세요.
     화면을 바꾸려면 server/static/guard.html 을 고치고 다시 빌드하세요. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JCC GUARD</title>
<meta name="description" content="JCC GUARD — 판넬 안 화재 징조·단자 과열·결로를 24시간 먼저 알아채는 감시 서비스">
<style>
  /*@FONTS-LOCAL — 서버에 보관한 글꼴(OFL). 시연 아티팩트 빌드는 이 블록을 구글 글꼴 불러오기로 바꾼다. */
  @font-face{font-family:"Gothic A1";src:url("fonts/GothicA1-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
  @font-face{font-family:"Gothic A1";src:url("fonts/GothicA1-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Gothic A1";src:url("fonts/GothicA1-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:"Gothic A1";src:url("fonts/GothicA1-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:"Gothic A1";src:url("fonts/GothicA1-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
  /*@FONTS-END*/

  /* ── JCC GUARD 토큰: 낮(기본) / 밤(시스템 어두움 또는 직접 선택). 위험일 때만 화면이 붉어진다 ── */
  :root{
    --bg:#f1efea;--glow:#ffffff;--card:#ffffff;--card-2:#f7f5f0;--line:#dcd7cc;--line-2:#e8e3d9;--track:#e3ded3;
    --ink:#1b1a17;--ink-2:#4c4840;--ink-3:#7a766d;--ok:#2f9a6c;--warn:#b9822a;--crit:#c0362f;--crit-ink:#c0362f;
    --btn:#1b1a17;--btn-ink:#ffffff;--alert-bg:#fbeeec;--alert-glow:#fff6f5;--shadow:0 1px 0 rgba(27,26,23,.06);
    --r-s:10px;--r-l:22px;--pill:999px;--sans:"Gothic A1",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--r:14px;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0b0d10;--glow:#1d2228;--card:#15191d;--card-2:#111418;--line:#2a2e33;--line-2:#23282e;--track:#23282e;
    --ink:#e9e6df;--ink-2:#bdb8ae;--ink-3:#8d8a83;--ok:#7fd1a8;--warn:#e9b45a;--crit:#ff6b60;--crit-ink:#ffb4ab;
    --btn:#e9e6df;--btn-ink:#0b0d10;--alert-bg:#120a0a;--alert-glow:#3a1414;--shadow:none;color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:#0b0d10;--glow:#1d2228;--card:#15191d;--card-2:#111418;--line:#2a2e33;--line-2:#23282e;--track:#23282e;
    --ink:#e9e6df;--ink-2:#bdb8ae;--ink-3:#8d8a83;--ok:#7fd1a8;--warn:#e9b45a;--crit:#ff6b60;--crit-ink:#ffb4ab;
    --btn:#e9e6df;--btn-ink:#0b0d10;--alert-bg:#120a0a;--alert-glow:#3a1414;--shadow:none;color-scheme:dark}

  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;font-family:var(--sans);color:var(--ink);background-color:var(--bg);
    background-image:radial-gradient(110% 60% at 50% 0%,var(--glow) 0%,var(--bg) 62%);background-attachment:fixed;
    -webkit-font-smoothing:antialiased;transition:background-color .6s ease}
  body.gd-alert{--bg:var(--alert-bg);--glow:var(--alert-glow)}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  .gd-k{font:500 11px var(--sans);letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
  .gd-mut{color:var(--ink-3)}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* 로그인 */
  .gd-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
  .gd-login form{width:min(380px,100%);display:flex;flex-direction:column}
  .gd-mark{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;margin-bottom:26px}
  .gd-mark i{width:14px;height:14px;border-radius:50%;background:var(--ok)}
  .gd-login h1{font:400 28px/1.32 var(--sans);letter-spacing:-.03em;margin:0}
  .gd-login p{font-size:14px;line-height:1.6;color:var(--ink-3);margin:10px 0 30px}
  .gd-fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font:500 11px var(--sans);color:var(--ink-3);letter-spacing:.06em}
  .gd-fld input{font:500 15px var(--sans);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:10px 2px;outline:none;border-radius:0}
  .gd-fld input:focus{border-bottom-color:var(--ink)}
  .gd-btn{margin-top:14px;padding:15px;border-radius:var(--r);border:0;background:var(--btn);color:var(--btn-ink);
    font:700 14px var(--sans);cursor:pointer;letter-spacing:.02em}
  .gd-btn:disabled{opacity:.5;cursor:default}
  .gd-err{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--crit-ink)}
  .gd-foot{margin-top:40px;font:500 10px var(--sans);letter-spacing:.2em;color:var(--ink-3);text-align:center}

  /* 머리 */
  .gd-app{max-width:1240px;margin:0 auto;padding:16px 18px 48px}
  .gd-head{display:flex;align-items:center;gap:12px;min-height:40px}
  .gd-head .gd-k{flex:none}
  .gd-site{font:600 14px var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .gd-head .sp{flex:1}
  .gd-ico{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
  .gd-ico svg{width:17px;height:17px}
  .gd-pick{font:500 12.5px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 8px;max-width:180px}

  /* 본문 2단(PC) / 1단(휴대폰) */
  .gd-main{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:8px}
  @media (min-width:960px){.gd-main{grid-template-columns:360px minmax(0,1fr);gap:34px;align-items:start}}
  /* 왼쪽 계기판은 고정하지 않는다 — 위험 카드가 붙으면 화면보다 길어져 아래(성과·연락처)를 못 본다 */

  /* 계기판 */
  .gd-ring{position:relative;width:min(230px,62vw);aspect-ratio:1;margin:14px auto 4px;cursor:pointer;border:0;background:none;padding:0;display:block}
  .gd-ring svg{position:absolute;inset:0;width:100%;height:100%}
  .gd-ring .trk{stroke:var(--track)}
  .gd-ring .val{stroke:var(--ok);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1),stroke .6s ease}
  .gd-ring.warn .val{stroke:var(--warn)} .gd-ring.crit .val{stroke:var(--crit)} .gd-ring.off .val{stroke:var(--ink-3)}
  .gd-ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gd-ring b{font:300 64px/1 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
  .gd-ring .mid{color:var(--ink)}
  .gd-ring .mid>span{margin-top:8px;font:500 11px var(--sans);letter-spacing:.14em;color:var(--ink-3)}
  .gd-ring .mid>small{margin-top:4px;font-size:11px;color:var(--ink-3)}
  .gd-state{text-align:center;margin-top:6px}
  .gd-state h2{margin:0;font:600 18px/1.4 var(--sans);letter-spacing:-.01em}
  .gd-state p{margin:4px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .gd-tri{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .gd-tri div{padding:13px 4px;text-align:center;border-left:1px solid var(--line)}
  .gd-tri div:first-child{border-left:0}
  .gd-tri b{display:block;font:300 25px var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .gd-tri span{display:block;margin-top:2px;font-size:11px;line-height:1.35;color:var(--ink-3)}
  .gd-contact{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .gd-contact .av{width:34px;height:34px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);flex:none;display:grid;place-items:center;font:600 12.5px var(--sans);color:var(--ink-2)}
  .gd-contact b{color:var(--ink);font-weight:600}
  .gd-contact a{margin-left:auto;flex:none;font:600 12.5px var(--sans);color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:var(--r-l);border:1px solid var(--line)}

  /* 위험 순간 */
  .gd-inc{border-radius:var(--r-l);padding:18px;background:color-mix(in srgb,var(--crit) 10%,var(--card));border:1px solid color-mix(in srgb,var(--crit) 35%,var(--line))}
  .gd-pill{display:inline-block;font:600 11px var(--sans);padding:4px 10px;border-radius:var(--r-l);background:color-mix(in srgb,var(--crit) 22%,transparent);color:var(--crit-ink);letter-spacing:.04em}
  .gd-inc h2{margin:12px 0 4px;font:600 20px/1.38 var(--sans);letter-spacing:-.01em}
  .gd-inc .d{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .gd-steps{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .gd-step{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:var(--r-s);background:color-mix(in srgb,var(--ink) 5%,transparent);font-size:14px;line-height:1.45}
  .gd-step i{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ok);position:relative;margin-top:1px}
  .gd-step i.ok::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--ok);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
  .gd-step i.go{border-color:var(--warn);border-style:dashed}
  .gd-step small{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
  .gd-acts{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gd-acts a,.gd-acts button{text-align:center;padding:13px 10px;border-radius:var(--r-s);font:600 14px var(--sans);text-decoration:none;cursor:pointer;white-space:nowrap}
  .gd-acts.one{grid-template-columns:1fr}
  .gd-acts .p{background:var(--btn);color:var(--btn-ink);border:0}
  .gd-acts .s{background:transparent;border:1px solid var(--line);color:var(--ink)}

  /* 판넬 */
  .gd-sec{margin-top:26px}
  .gd-sec:first-child{margin-top:0}
  .gd-sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .gd-sec-h h3{margin:0;font:600 15px var(--sans)}
  .gd-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  @media (min-width:700px){.gd-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:1180px){.gd-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .gd-card{text-align:left;padding:15px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);cursor:pointer;width:100%;display:block}
  .gd-card:hover{border-color:var(--line)}
  .gd-card.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .gd-card.crit{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
  .gd-card .h{display:flex;align-items:center;gap:8px}
  .gd-card .h b{font:600 14px var(--sans);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gd-card .h span{margin-left:auto;flex:none;font-size:11px;color:var(--ink-3)}
  .gd-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
  .gd-dot.warn{background:var(--warn)} .gd-dot.crit{background:var(--crit)} .gd-dot.offline{background:var(--ink-3)}
  .gd-card .v{display:flex;gap:18px;margin-top:12px}
  .gd-card .v div{min-width:0}
  .gd-card .v b{display:block;font:300 21px var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .gd-card .v span{font-size:11px;color:var(--ink-3)}
  .gd-card .why{margin-top:10px;font-size:12.5px;color:var(--ink-2);line-height:1.5}

  /* 이번 달 */
  .gd-month{padding:20px;border-radius:var(--r-l);background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow)}
  .gd-month .nav{display:flex;align-items:center;gap:6px}
  .gd-month .nav .gd-ico{width:30px;height:30px}
  .gd-month .nav .gd-k{margin-right:auto}
  .gd-big{font:300 30px/1.28 var(--sans);letter-spacing:-.03em;margin:16px 0 6px;word-break:keep-all}
  .gd-big em{font-style:normal;color:var(--ok)}
  .gd-month .lede{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin:0}
  .gd-led{margin-top:16px;border-top:1px solid var(--line)}
  .gd-led div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:14px}
  .gd-led b{font:300 21px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
  .gd-led small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
  .gd-docs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .gd-doc{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:var(--r-s);background:var(--card-2);border:1px solid var(--line-2);font-size:14px;cursor:pointer;width:100%;text-align:left}
  .gd-doc span:last-child{color:var(--ink-3);font-size:12.5px}
  .gd-empty{padding:28px 10px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.6}

  /* 시트(휴대폰 아래에서 올라옴 / PC 가운데) */
  .gd-scrim{position:fixed;inset:0;background:rgba(8,10,12,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .gd-scrim.on{opacity:1;pointer-events:auto}
  .gd-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;overflow:auto;background:var(--card);color:var(--ink);
    border-radius:var(--r-l) var(--r-l) 0 0;padding:10px 20px 28px;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);
    border-top:1px solid var(--line)}
  .gd-sheet.on{transform:none}
  @media (min-width:760px){.gd-sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,calc(100vw - 48px));border-radius:var(--r-l);
    border:1px solid var(--line);transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .28s ease,opacity .28s ease}
    .gd-sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
  .gd-grab{width:40px;height:4px;border-radius:var(--pill);background:var(--line);margin:4px auto 14px}
  @media (min-width:760px){.gd-grab{display:none}}
  .gd-sheet h4{margin:0;font:600 17px var(--sans)}
  .gd-sheet .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .gd-x{position:absolute;top:12px;right:14px}
  .gd-ded{margin-top:14px}
  .gd-ded div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14px}
  .gd-ded b{font-weight:600;color:var(--warn);white-space:nowrap}
  .gd-ded b.z{color:var(--ink-3);font-weight:500}
  .gd-note{margin-top:12px;font-size:11px;color:var(--ink-3);line-height:1.6}
  .gd-gg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .gd-g{padding:13px;border-radius:var(--r);background:var(--card-2);border:1px solid var(--line-2)}
  .gd-g b{font:300 26px var(--sans);letter-spacing:-.02em}
  .gd-g b small{font-size:12.5px;color:var(--ink-3);margin-left:3px}
  .gd-g span{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}
  .gd-life{margin-top:10px;padding:13px;border-radius:var(--r);border:1px solid var(--line)}
  .gd-life b{font:600 14px var(--sans)}
  .gd-life p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .gd-tl{margin-top:16px;border-left:1px solid var(--line);margin-left:4px;padding-left:14px;display:flex;flex-direction:column;gap:11px}
  .gd-tl div{font-size:12.5px;line-height:1.45;position:relative}
  .gd-tl div::before{content:"";position:absolute;left:-18px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--line)}
  .gd-tl div.self::before{background:var(--ok)} .gd-tl div.alarm::before{background:var(--warn)}
  .gd-tl small{display:block;color:var(--ink-3);font-size:11px}
  .gd-rep h5{margin:16px 0 6px;font:600 14px var(--sans)}
  .gd-rep p,.gd-rep li{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .gd-rep ul{margin:0;padding-left:18px}
  .gd-rep table{width:100%;border-collapse:collapse;font-size:12.5px}
  .gd-rep td{padding:7px 4px;border-bottom:1px solid var(--line-2);vertical-align:top}
  .gd-rep img.sign{max-width:220px;background:#fff;border-radius:var(--r-s);margin-top:6px}
  /* 시연판 전용 — '그날 밤 다시 보기'(실제 화면 위에서 사고가 날 뻔한 이야기를 재생) */
  .gd-story{margin-top:12px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
  .gd-story .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .gd-story .top b{font:600 14px var(--sans);margin-right:auto}
  .gd-story .top button{font:600 12.5px var(--sans);padding:8px 13px;border-radius:var(--pill);border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink-2)}
  .gd-story .top button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
  .gd-cap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:14px}
  .gd-cap div{padding:0 12px;border-left:1px solid var(--line-2);opacity:.38;transition:opacity .5s ease}
  .gd-cap div:first-child{border-left:0;padding-left:0}
  .gd-cap div.on{opacity:1}
  .gd-cap div.intro{grid-column:1/-1}
  .gd-cap b{display:block;font:300 20px var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .gd-cap div.now b{color:var(--crit)} .gd-cap div.end b{color:var(--ok)}
  .gd-cap p{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
  @media (max-width:760px){.gd-cap{grid-template-columns:1fr;gap:10px}.gd-cap div{border-left:0;padding:0}}
  .gd-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--btn);color:var(--btn-ink);
    font:600 12.5px var(--sans);padding:11px 16px;border-radius:var(--pill);opacity:0;transition:opacity .25s ease;pointer-events:none}
  .gd-toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{.gd-head,.gd-left,.gd-sec,.gd-scrim,.gd-x{display:none!important}
    .gd-sheet{position:static;transform:none!important;opacity:1!important;max-height:none;border:0;width:auto}}
</style>
</head>
<body>
<!-- JCC GUARD 고객 화면: 안심 계기판(밤/낮). 숫자는 서버(guard.py)가 실제 기록에서 만든다. 고객 조작은 보기와 경보 확인뿐 -->

<section class="gd-login" id="gd-login" hidden>
  <form id="gd-login-form" autocomplete="on">
    <div class="gd-mark" aria-hidden="true"><i></i></div>
    <h1>당신의 공장을<br>지켜보고 있습니다.</h1>
    <p>JCC GUARD — 판넬 안 화재 징조·단자 과열·결로를<br>24시간 먼저 알아채는 감시 서비스</p>
    <label class="gd-fld">아이디<input id="gd-user" name="username" autocomplete="username" required></label>
    <label class="gd-fld">비밀번호<input id="gd-pw" name="password" type="password" autocomplete="current-password" required></label>
    <div id="gd-newpw-wrap" hidden><label class="gd-fld">새 비밀번호 (처음 로그인 — 8자 이상)<input id="gd-newpw" type="password" autocomplete="new-password" minlength="8"></label></div>
    <button class="gd-btn" id="gd-login-btn" type="submit">들어가기</button>
    <div class="gd-err" id="gd-login-err" role="alert"></div>
    <div class="gd-foot">JCC SOLUTION</div>
  </form>
</section>

<div class="gd-app" id="gd-app" hidden>
  <header class="gd-head">
    <span class="gd-k">JCC GUARD</span>
    <span class="gd-site" id="gd-site"></span>
    <span class="sp"></span>
    <select class="gd-pick" id="gd-pick" aria-label="미리 볼 고객사" hidden></select>
    <button class="gd-ico" id="gd-theme" aria-label="밤·낮 화면 바꾸기" title="밤·낮 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="gd-ico" id="gd-out" aria-label="로그아웃" title="로그아웃"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
  </header>

  <section class="gd-story" id="gd-story" hidden aria-label="시연 — 그날 밤 다시 보기">
    <div class="top"><b>가상 공장 시연 · 그날 밤 다시 보기</b>
      <button data-story="fire" aria-pressed="false">화재 징조</button><button data-story="contact" aria-pressed="false">단자 과열</button>
      <button data-story="dew" aria-pressed="false">장마철 결로</button></div>
    <div class="gd-cap" id="gd-cap"><div class="on intro"><p>이야기를 고르면 실제 화면이 그날 밤처럼 움직이고, 판넬과 JCC가 한 일을 시간 순서로 보여 드립니다.</p></div></div>
  </section>

  <main class="gd-main">
    <div class="gd-left">
      <div id="gd-inc" hidden></div>
      <button class="gd-ring" id="gd-ring" aria-label="안심 지수 — 눌러서 이유 보기">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="88" fill="none" stroke-width="8"/>
          <circle class="val" id="gd-arc" cx="100" cy="100" r="88" fill="none" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="552.92" stroke-dashoffset="552.92" transform="rotate(-90 100 100)"/></svg>
        <span class="mid"><b id="gd-score">—</b><span>안심 지수</span><small id="gd-why-hint">눌러서 이유 보기</small></span>
      </button>
      <div class="gd-state"><h2 id="gd-title">불러오는 중</h2><p id="gd-sub"></p></div>
      <div class="gd-tri" id="gd-tri"></div>
      <div class="gd-contact" id="gd-contact"></div>
    </div>
    <div class="gd-right">
      <section class="gd-sec"><div class="gd-sec-h"><h3>판넬</h3><span class="gd-k">문제 있는 것부터</span></div><div class="gd-grid" id="gd-panels"></div></section>
      <section class="gd-sec"><div class="gd-month" id="gd-month"></div></section>
    </div>

</div>

<div class="gd-scrim" id="gd-scrim"></div>
<div class="gd-sheet" id="gd-sheet" role="dialog" aria-modal="true" aria-labelledby="gd-sheet-t"><div class="gd-grab"></div>
  <button class="gd-ico gd-x" id="gd-sheet-x" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="gd-sheet-body"></div></div>
<div class="gd-toast" id="gd-toast" role="status"></div>

<script src="predict-core.js?v=715bbefa"></script>
<script src="tuning-data.js?v=06a3f067"></script>
<script src="demo-api.js?v=083b8202"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const G = { d: null, user: null, period: null, month: null, timer: null, cid: "" };
const C = 2 * Math.PI * 88;
const KST = { timeZone: "Asia/Seoul" };
const fmtT = t => t ? new Date(t * 1000).toLocaleString("ko-KR", {...KST, month:"long", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false}) : "";
const ago = t => { if (!t) return ""; const s = Math.max(0, Date.now() / 1000 - t); return s < 60 ? "방금" : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${Math.floor(s / 86400)}일 전`; };
const per = p => `${Number(p.slice(5, 7))}월`;
const clean = s => String(s == null ? "" : s).replace(/[\p{Extended_Pictographic}\uFE0F]\s*/gu, "");   // 기록 문구의 그림 문자는 뺀다
function toast(t){ const el = $("#gd-toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2600); }

// ── 밤·낮: 시스템을 따르고, 직접 고르면 기억한다 ─────────────
function theme(t){ if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
try { theme(localStorage.getItem("gd-theme")); } catch(_){}
$("#gd-theme").onclick = () => {
  const dark = document.documentElement.getAttribute("data-theme") ? document.documentElement.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  const t = dark ? "light" : "dark"; theme(t); try { localStorage.setItem("gd-theme", t); } catch(_){}
};

// ── 로그인 ───────────────────────────────────────────────
async function status(){ return (await fetch("/api/auth/status", {cache:"no-store"})).json(); }
function showLogin(msg){ $("#gd-app").hidden = true; $("#gd-login").hidden = false; $("#gd-login-err").textContent = msg || ""; setTimeout(() => $("#gd-user").focus(), 50); }
$("#gd-login-form").addEventListener("submit", async e => {
  e.preventDefault(); const b = $("#gd-login-btn"); b.disabled = true; $("#gd-login-err").textContent = "";
  const user = $("#gd-user").value.trim(), pw = $("#gd-pw").value, np = $("#gd-newpw").value;
  try {
    let r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({user, password: pw})});
    let j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "로그인하지 못했습니다");
    let s = await status();
    if (s.user && s.user.must_change){
      if (!np){ $("#gd-newpw-wrap").hidden = false; $("#gd-newpw").focus(); throw new Error("처음 로그인입니다 — 새 비밀번호를 정해 주세요"); }
      r = await fetch("/api/me/password", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({old: pw, new: np})});
      j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "비밀번호를 바꾸지 못했습니다");
      await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({user, password: np})});
      s = await status();
    }
    $("#gd-pw").value = ""; $("#gd-newpw").value = ""; start(s);
  } catch(err){ $("#gd-login-err").textContent = err.message; }
  b.disabled = false;
});
$("#gd-out").onclick = async () => { await fetch("/api/logout", {method:"POST"}).catch(() => {}); clearInterval(G.timer); if (G.auth) showLogin(); else location.reload(); };

async function start(s){
  G.user = s.user; G.auth = !!s.enabled;
  $("#gd-login").hidden = true; $("#gd-app").hidden = false;
  const admin = !s.enabled || (s.user && s.user.role === "admin");
  if (window.JCC_DEMO) story(); else if (admin) pickers();
  $("#gd-out").hidden = !s.enabled;
  await load(); clearInterval(G.timer); G.timer = setInterval(load, 5000);
}
async function pickers(){
  // JCC 직원: 고객사를 골라 그 고객이 보는 화면 그대로 미리 본다(주소의 ?customer_id= 도 받는다)
  const sel = $("#gd-pick"); G.cid = new URLSearchParams(location.search).get("customer_id") || "";
  try { const j = await (await fetch("/api/admin/accounts", {cache:"no-store"})).json();
    sel.innerHTML = `<option value="">전체 현장</option>` + (j.customers || []).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
    sel.value = G.cid; sel.hidden = false;
    sel.onchange = () => { G.cid = sel.value; G.month = null; load(); };
  } catch(_){}
}
const q = () => G.cid ? `customer_id=${encodeURIComponent(G.cid)}` : "";

// ── 데이터 ───────────────────────────────────────────────
async function load(){
  try { const r = await fetch("/api/guard?" + q(), {cache:"no-store"});
    if (r.status === 401) return showLogin("다시 로그인해 주세요");
    if (!r.ok) throw new Error(); G.d = await r.json(); paint(); }
  catch(_){ offline(); }
}
function offline(){
  const ring = $("#gd-ring"); ring.className = "gd-ring off";
  $("#gd-title").textContent = "연결을 다시 잇는 중";
  $("#gd-sub").textContent = "판넬은 현장에서 스스로 지키고 있습니다";
}

function paint(){
  const d = G.d, ix = d.index;
  $("#gd-site").textContent = d.site;
  document.title = `${ix.score} · ${d.site} — JCC GUARD`;
  const ring = $("#gd-ring"), arc = $("#gd-arc"), first = !G.painted;
  if (first) arc.style.transition = "none";   // 처음 열 때는 바로 그 상태로 — 위험 중에 초록이 번쩍이지 않게
  ring.className = "gd-ring " + ix.color;
  arc.style.strokeDashoffset = String(C * (1 - ix.score / 100));
  if (first){ arc.getBoundingClientRect(); requestAnimationFrame(() => { arc.style.transition = ""; }); G.painted = true; }
  $("#gd-score").textContent = ix.score;
  $("#gd-why-hint").textContent = ix.items.length ? `−${100 - ix.score} · 이유 보기` : "눌러서 근거 보기";
  $("#gd-title").textContent = d.state.title; $("#gd-sub").textContent = d.state.sub;
  document.body.classList.toggle("gd-alert", !!d.incident);
  paintIncident(d.incident);
  const m = d.month;
  $("#gd-tri").innerHTML = m.building
    ? `<div><b>—</b><span>미리 잡은 징조<br>(기록 쌓이는 중)</span></div><div><b>—</b><span>스스로 한 조치</span></div><div><b>24시간</b><span>감시 중</span></div>`
    : `<div><b>${m.precursors.total}</b><span>이번 달<br>미리 잡은 징조</span></div><div><b>${m.actions.total}</b><span>판넬이<br>스스로 한 조치</span></div>` +
      `<div><b>${m.ack_min_avg == null ? "—" : m.ack_min_avg + "분"}</b><span>위험 경보<br>평균 대응</span></div>`;
  const c = d.contact, who = c.engineer ? `담당 ${esc(c.engineer)}` : esc(c.desk);
  const due = d.next_inspection ? (d.next_inspection < Date.now() / 1000 ? "정기 점검 기한 지남" : `다음 정기 점검 D-${Math.ceil((d.next_inspection - Date.now() / 1000) / 86400)}`) : "정기 점검 일정 협의 중";
  $("#gd-contact").innerHTML = `<span class="av" aria-hidden="true">${esc((c.engineer || "JCC").slice(0, 1))}</span><span><b>${who}</b><br>이상하면 JCC가 먼저 연락드립니다 · ${due}</span>` +
    (c.phone ? `<a href="tel:${esc(c.phone.replace(/[^0-9+]/g, ""))}">전화</a>` : "");
  paintPanels(d.panels);
  if (!G.month || G.month.period === m.period){ G.month = m; paintMonth(); }
}

function paintIncident(inc){
  const box = $("#gd-inc");
  if (!inc){ box.hidden = true; box.innerHTML = ""; return; }
  const canAck = G.user && G.user.role === "manager" && !inc.acked_at;
  box.hidden = false;
  box.innerHTML = `<div class="gd-inc"><span class="gd-pill">위험 · ${ago(inc.raised_at)}</span>` +
    `<h2>${esc(inc.panel_name)}에서<br>${esc(inc.sensor_name)} 이상을 감지했습니다</h2><div class="d">${esc(clean(inc.detail))}</div>` +
    `<div class="gd-steps">${inc.steps.map(s => `<div class="gd-step"><i class="${s.done ? "ok" : "go"}" aria-hidden="true"></i><span>${esc(clean(s.text))}<small>${s.ts ? fmtT(s.ts) : "진행 중"}</small></span></div>`).join("")}</div>` +
    `<div class="gd-acts${G.d.contact.phone ? "" : " one"}">${G.d.contact.phone ? `<a class="p" href="tel:${esc(G.d.contact.phone.replace(/[^0-9+]/g, ""))}">JCC에 전화</a>` : ""}` +
    (canAck ? `<button class="s" id="gd-ack">현장 확인했어요</button>` : `<button class="s" data-open="${esc(inc.panel)}">자세히 보기</button>`) + `</div></div>`;
  const ack = $("#gd-ack");
  if (ack) ack.onclick = async () => { ack.disabled = true;
    const r = await fetch("/api/alarm/ack", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({alarm_id: inc.id, note: "고객 현장 확인", cause: ""})}).catch(() => null);
    toast(r && r.ok ? "확인을 JCC에 알렸습니다" : "보내지 못했습니다 — 전화로 알려 주세요"); load(); };
  box.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openPanel(b.dataset.open));
}

function paintPanels(ps){
  const box = $("#gd-panels");
  if (!ps.length){ box.innerHTML = `<div class="gd-empty">아직 연결된 판넬이 없습니다.<br>설치가 끝나면 이곳에서 24시간 지켜봅니다.</div>`; return; }
  box.innerHTML = ps.map(p => {
    const third = p.contact !== "—" && p.contact !== "정상" ? ["단자 발열", p.contact] : p.fire !== "—" ? ["화재 징조", p.fire]
      : p.dew !== "—" ? ["결로", p.dew] : null;   // 판정할 센서가 없으면 칸을 비우지 않고 뺀다
    return `<button class="gd-card ${p.status === "ok" ? "" : p.status === "offline" ? "" : p.status}" data-open="${esc(p.panel)}">` +
      `<span class="h"><i class="gd-dot ${p.status}" aria-hidden="true"></i><b>${esc(p.panel_name)}</b><span>${esc(p.word)}</span></span>` +
      `<span class="v"><div><b>${p.temp == null ? "—" : p.temp + "℃"}</b><span>온도</span></div><div><b>${p.humidity == null ? "—" : p.humidity + "%"}</b><span>습도</span></div>` +
      (third ? `<div><b>${esc(third[1])}</b><span>${third[0]}</span></div>` : "") + `</span>` +
      (p.why.length && p.status !== "ok" ? `<span class="why">${esc(p.why.slice(0, 2).join(" · "))}</span>` : "") + `</button>`;
  }).join("");
  box.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openPanel(b.dataset.open));
}

// ── 이번 달 지켜낸 것 ─────────────────────────────────────
function paintMonth(){
  const m = G.month, now = G.d.month.period, isNow = m.period === now;
  const el = $("#gd-month");
  const head = `<div class="nav"><span class="gd-k">${isNow ? "이번 달" : per(m.period)} · 지켜낸 것</span>` +
    `<button class="gd-ico" id="gd-mprev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>` +
    `<button class="gd-ico" id="gd-mnext" aria-label="다음 달" ${isNow ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>`;
  const body = m.building
    ? `<div class="gd-big">기록이 쌓이는 중입니다.</div><p class="lede">설치 후 며칠이 지나면 이곳에 JCC가 지켜낸 것이 쌓입니다. 지금도 24시간 감시하고 있습니다.</p>`
    : `<div class="gd-big">${isNow ? "이번 달" : per(m.period) + "에"}, JCC가<br><em>${m.hours.toLocaleString("ko-KR")}시간</em> 지켰습니다.</div>` +
      `<p class="lede">사람이 순찰했다면 약 ${m.patrols.count.toLocaleString("ko-KR")}번이 필요했던 시간입니다 <span class="gd-mut">(하루 ${m.patrols.per_day}회 기준 추정)</span>.</p>` +
      `<div class="gd-led">` +
      `<div><span>미리 잡은 위험 징조<small>화재 ${m.precursors.fire} · 단자 과열 ${m.precursors.contact} · 결로 ${m.precursors.dew}</small></span><b>${m.precursors.total}건</b></div>` +
      `<div><span>판넬이 스스로 한 조치<small>환기 ${m.actions.vent} · 히터·팬 ${m.actions.dew}</small></span><b>${m.actions.total}회</b></div>` +
      `<div><span>원격으로 해결<small>현장 출동 없이 다시 잇기</small></span><b>${m.remote}건</b></div>` +
      `<div><span>위험 경보 평균 대응</span><b>${m.ack_min_avg == null ? "—" : m.ack_min_avg + "분"}</b></div></div>`;
  el.innerHTML = head + body + `<div class="gd-docs"><button class="gd-doc" id="gd-docs-m"><span>월간 보고서</span><span>열기 ›</span></button>` +
    `<button class="gd-doc" id="gd-docs-i"><span>정기 점검 보고서 · 고객 서명</span><span>열기 ›</span></button></div>`;
  $("#gd-mprev").onclick = () => moveMonth(-1);
  $("#gd-mnext").onclick = () => moveMonth(1);
  $("#gd-docs-m").onclick = openMonthly; $("#gd-docs-i").onclick = openInspections;
}
async function moveMonth(dir){
  const [y, mo] = G.month.period.split("-").map(Number), dt = new Date(y, mo - 1 + dir, 1);
  const p = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`;
  if (p > G.d.month.period) return;
  try { const r = await fetch(`/api/guard/month?period=${p}&${q()}`, {cache:"no-store"}); if (!r.ok) throw new Error(); G.month = await r.json(); paintMonth(); }
  catch(_){ toast("그 달 기록을 불러오지 못했습니다"); }
}

// ── 시트 ─────────────────────────────────────────────────
function sheet(html){ $("#gd-sheet-body").innerHTML = html; $("#gd-scrim").classList.add("on"); $("#gd-sheet").classList.add("on"); $("#gd-sheet").scrollTop = 0; }
function unsheet(){ $("#gd-scrim").classList.remove("on"); $("#gd-sheet").classList.remove("on"); }
$("#gd-scrim").onclick = unsheet; $("#gd-sheet-x").onclick = unsheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") unsheet(); });

$("#gd-ring").onclick = () => {
  const ix = G.d && G.d.index; if (!ix) return;
  sheet(`<h4 id="gd-sheet-t">왜 ${ix.score}점인가요?</h4><div class="sub">100점에서 지금 상태만큼 뺍니다 · 실시간</div><div class="gd-ded">` +
    ix.items.map(i => `<div><span>${esc(i.text)}</span><b>−${i.minus}</b></div>`).join("") +
    ix.checks.map(c => `<div><span>${esc(c.label)}</span><b class="z">${esc(c.value)}</b></div>`).join("") + `</div>` +
    `<div class="gd-note">위험 경보 −20(판넬당 최대 −40) · 주의 경보 −5(판넬당 최대 −15) · 감시 장치 끊김 −10 · 화재 징조 지켜보는 중 −5 · 결로·단자 발열 주의 −3 · 부품 남은 여유 60일 이내 −3 · 정기 점검 기한 지남 −5</div>`);
};

async function openPanel(pid){
  sheet(`<h4 id="gd-sheet-t">불러오는 중</h4>`);
  try { const r = await fetch(`/api/guard/panel?panel=${encodeURIComponent(pid)}&${q()}`, {cache:"no-store"}); if (!r.ok) throw new Error();
    const {panel: p, timeline} = await r.json();
    const lf = p.life;
    sheet(`<h4 id="gd-sheet-t">${esc(p.panel_name)}</h4><div class="sub">${esc(p.word)}${p.why.length && p.status !== "ok" ? " · " + esc(p.why[0]) : ""}${p.vent_open ? " · 환기 열림" : ""}</div>` +
      `<div class="gd-gg"><div class="gd-g"><b>${p.temp == null ? "—" : p.temp}<small>℃</small></b><span>판넬 안 온도</span></div>` +
      `<div class="gd-g"><b>${p.humidity == null ? "—" : p.humidity}<small>%</small></b><span>습도${p.dew !== "—" ? " · " + esc(p.dew) : ""}</span></div>` +
      (p.fire !== "—" ? `<div class="gd-g"><b>${esc(p.fire)}</b><span>화재 징조</span></div>` : "") +
      (p.contact !== "—" ? `<div class="gd-g"><b>${esc(p.contact)}</b><span>단자 발열</span></div>` : "") + `</div>` +
      (lf ? `<div class="gd-life"><b>${esc(lf.label)} — ${esc(lf.say)}</b><p>${lf.status === "reached" ? "기준에 닿았습니다. JCC가 조치 일정을 잡아 연락드립니다." : "지금 추세 그대로라면 이 무렵 점검이 필요합니다. 정기 점검 때 함께 봅니다."}</p></div>` : "") +
      (timeline.length ? `<div class="gd-tl">${timeline.map(t => `<div class="${t.who === "판넬이 스스로" ? "self" : t.who === "감지" ? "alarm" : ""}">${esc(clean(t.text))}<small>${fmtT(t.ts)} · ${esc(t.who)}</small></div>`).join("")}</div>`
        : `<div class="gd-empty">최근 7일 동안 특별한 일이 없었습니다.</div>`));
  } catch(_){ sheet(`<h4 id="gd-sheet-t">불러오지 못했습니다</h4><div class="sub">잠시 뒤 다시 열어 주세요</div>`); }
}

async function openMonthly(){
  sheet(`<h4 id="gd-sheet-t">월간 보고서</h4><div class="sub">불러오는 중</div>`);
  try { const j = await (await fetch("/api/monthly?" + q(), {cache:"no-store"})).json(); const reps = j.reports || [];
    if (!reps.length) return sheet(`<h4 id="gd-sheet-t">월간 보고서</h4><div class="gd-empty">아직 발행된 월간 보고서가 없습니다.<br>매달 초 지난달 보고서가 이곳에 올라옵니다.</div>`);
    sheet(`<h4 id="gd-sheet-t">월간 보고서</h4><div class="sub">발행된 그대로 보관됩니다</div><div class="gd-docs">` +
      reps.map((r, i) => `<button class="gd-doc" data-i="${i}"><span>${per(r.period)} · ${esc(r.period.slice(0, 4))}</span><span>보기 ›</span></button>`).join("") + `</div>`);
    $("#gd-sheet-body").querySelectorAll("[data-i]").forEach(b => b.onclick = () => monthlyDoc(reps[+b.dataset.i]));
  } catch(_){ sheet(`<h4 id="gd-sheet-t">불러오지 못했습니다</h4>`); }
}
function monthlyDoc(r){
  const rp = r.report || {}, s = rp.summary || {};
  sheet(`<div class="gd-rep"><h4 id="gd-sheet-t">${esc(rp.customer || "")} ${per(r.period)} 보고서</h4><div class="sub">${esc(r.period)} · 판넬 ${s.panels ?? "—"}면 · 가동률 ${s.uptime ?? "—"}%</div>` +
    (rp.ai_note ? `<p style="margin-top:12px">${esc(rp.ai_note)}</p>` : "") +
    `<div class="gd-led"><div><span>미리 잡은 위험 징조</span><b>${s.precursors ?? 0}건</b></div><div><span>자동 환기</span><b>${s.vent_auto ?? 0}회</b></div>` +
    `<div><span>위험 경보 · 평균 대응</span><b>${s.alarms_crit ?? 0}건 · ${s.ack_min_avg == null ? "—" : s.ack_min_avg + "분"}</b></div><div><span>원격으로 해결</span><b>${s.self_heal ?? 0}건</b></div></div>` +
    ((rp.advice || []).length ? `<h5>JCC가 권하는 것</h5><ul>${rp.advice.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : "") +
    printBtn() + `</div>`);
}
async function openInspections(){
  sheet(`<h4 id="gd-sheet-t">정기 점검 보고서</h4><div class="sub">불러오는 중</div>`);
  try { const j = await (await fetch("/api/inspections", {cache:"no-store"})).json();
    const list = (j.inspections || []).filter(x => x.status === "done");
    if (!list.length) return sheet(`<h4 id="gd-sheet-t">정기 점검 보고서</h4><div class="gd-empty">아직 완료된 정기 점검이 없습니다.</div>`);
    const W = {ok:"이상 없음", fix:"현장 조치 완료", bad:"조치 필요 항목 있음"};
    sheet(`<h4 id="gd-sheet-t">정기 점검 보고서</h4><div class="sub">고객 확인 서명까지 받은 기록</div><div class="gd-docs">` +
      list.map(x => `<button class="gd-doc" data-id="${x.id}"><span>${esc(x.panel_name || x.panel)} · ${fmtT(x.done_at)}</span><span>${esc(W[x.overall] || "")} ›</span></button>`).join("") + `</div>`);
    $("#gd-sheet-body").querySelectorAll("[data-id]").forEach(b => b.onclick = () => inspDoc(b.dataset.id));
  } catch(_){ sheet(`<h4 id="gd-sheet-t">불러오지 못했습니다</h4>`); }
}
async function inspDoc(id){
  try { const r = (await (await fetch("/api/inspection/" + encodeURIComponent(id), {cache:"no-store"})).json()).report;
    const R = {ok:"정상", fix:"조치함", bad:"조치 필요", na:"해당 없음"};
    const rows = r.checklist.flatMap(g => g.items.map(it => `<tr><td>${esc(it.label)}</td><td>${R[r.results[it.key] || "na"]}</td><td>${esc(r.notes[it.key] || "")}</td></tr>`)).join("");
    sheet(`<div class="gd-rep"><h4 id="gd-sheet-t">${esc(r.panel_name)} 정기 점검</h4><div class="sub">${fmtT(r.done_at)} · 점검 ${esc(r.by)} · 확인 ${esc(r.signer)}</div>` +
      (r.summary ? `<h5>특이사항·조치</h5><p>${esc(r.summary)}</p>` : "") + `<h5>점검 항목</h5><table>${rows}</table>` +
      `<h5>고객 확인</h5><img class="sign" src="${esc(r.signature)}" alt="${esc(r.signer)} 서명">` +
      printBtn() + `</div>`);
  } catch(_){ toast("보고서를 열지 못했습니다"); }
}

// ── 시연판: 그날 밤 다시 보기 ──────────────────────────────
// 시뮬레이션 에피소드(약 90초)를 시작하고, 같은 시간 동안 이야기 자막을 한 칸씩 켠다. 화면(지수·위험 카드)은 실제 데이터로 따라 움직인다.
const STORIES = {
  fire: [["02:14", "배터리실 수소가 평소보다 조금씩 오르기 시작 — 사람은 못 느끼는 수준"], ["02:31", "화재 징조 판단 — 판넬이 몇 초 만에 스스로 환기를 엶"],
         ["02:32", "JCC 관제실 확인 · 당직자에게 알림"], ["03:10", "수소·온도 정상으로 — 원인은 기록으로 남김"], ["07:00", "공장은 평소처럼 가동 — 그날 밤 사고는 없었다"]],
  contact: [["14:02", "부하는 그대로인데 단자 온도만 서서히 상승 — 풀린 단자의 신호"], ["14:20", "단자 발열 징조 판단 — 담당자에게 알림"],
            ["14:22", "JCC가 원격으로 수치 확인 · 점검 예약"], ["다음 날", "현장에서 단자 재조임 — 불로 번지기 전에 끝"], ["그 뒤", "라인 정지 없이 생산 계속"]],
  dew: [["05:40", "장마철 새벽, 판넬 안 습도가 오르기 시작"], ["05:52", "결로 위험 판단 — 판넬이 스스로 히터·팬 가동"],
        ["06:10", "습도가 내려가는 것을 JCC가 확인"], ["06:30", "물방울 없이 아침 가동 준비 끝"], ["그날", "누전·절연 사고 없이 지나감"]],
};
let storyTimers = [];
function story(){
  $("#gd-story").hidden = false;
  document.querySelectorAll("[data-story]").forEach(b => b.onclick = () => {
    storyTimers.forEach(clearTimeout); storyTimers = [];
    document.querySelectorAll("[data-story]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    const k = b.dataset.story, steps = STORIES[k];
    try { window.JCC_DEMO.episode(k); } catch(_){}
    $("#gd-cap").innerHTML = steps.map((st, i) => `<div class="${i === 1 ? "now" : i === steps.length - 1 ? "end" : ""}"><b>${esc(st[0])}</b><p>${esc(st[1])}</p></div>`).join("");
    const cells = [...$("#gd-cap").children];
    steps.forEach((_, i) => storyTimers.push(setTimeout(() => { cells[i].classList.add("on"); load(); }, i * 16000 + 600)));
    window.scrollTo({top: 0, behavior: "smooth"});
  });
}

// 보고서 인쇄·PDF 저장 — 시연판(공개 링크)은 인쇄 창을 열 수 없어 버튼을 두지 않는다
const printBtn = () => window.JCC_DEMO ? "" : `<p style="margin-top:16px"><button class="gd-btn" style="width:100%" onclick="window.print()">인쇄 · PDF로 저장</button></p>`;

// ── 시작 ─────────────────────────────────────────────────
(async () => {
  try { const s = await status();
    if (!s.enabled || s.authed){
      if (s.user && s.user.must_change) return showLogin("처음 로그인입니다 — 새 비밀번호를 정해 주세요");
      return start(s);
    }
    showLogin();
  } catch(_){ showLogin("서버에 연결하지 못했습니다 — 잠시 뒤 다시 시도해 주세요"); }
})();
</script>
