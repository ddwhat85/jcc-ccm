<title>JCC-CCM 노드 모니터</title>
<style>
  /* RAL 팬덱 기반 팔레트 + SmartRay 노드에디터 시각언어 */
  :root{
    --ground:#eef0ec; --canvas:#f6f7f4; --surface:#ffffff; --surface-2:#e7eae3;
    --ink:#1a1d19; --ink-2:#4a4f48; --ink-3:#727870;
    --rule:#c9ccc2; --rule-2:#d9dcd3;
    --accent:#00437a; --accent-soft:#d6e0ec;
    --node-head-1:#2f3f6b; --node-head-2:#3c4f85; --node-head-ink:#eef2fb;
    --node-body:#eef1f6; --node-border:#c3ccd9;
    --port-sensor:#5c9a4f; --port-data:#3f7fb0; --port-agg:#8a6db0;
    --wire:#3f8fb0; --wire-label:#3a4658;
    --ok:#3f7d2b; --ok-soft:#deebd6; --warn:#9a7800; --warn-soft:#f5e9c4;
    --crit:#a81917; --crit-soft:#f3dad9;
    --toolbar:#14171c; --toolbar-ink:#e6e8ea; --run:#b4c62b;
    --sel:#e6912a;
    /* macOS 메뉴바 (light) */
    --menubar-bg:rgba(246,246,248,.72); --menubar-border:rgba(0,0,0,.10);
    --menu-hover:rgba(0,0,0,.06); --menu-bg:rgba(250,250,252,.86);
    --menu-border:rgba(0,0,0,.10); --menu-accent:#0a84ff;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI","Malgun Gothic",sans-serif;
    --mono:"SF Mono","Cascadia Mono","Consolas",ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0f1113; --canvas:#15181d; --surface:#1c2026; --surface-2:#232830;
    --ink:#e7eae6; --ink-2:#b2b8ae; --ink-3:#868c82;
    --rule:#2f343c; --rule-2:#262b32;
    --accent:#79aede; --accent-soft:#1a2c3c;
    --node-head-1:#20304f; --node-head-2:#2a3c63; --node-head-ink:#dbe4f5;
    --node-body:#222834; --node-border:#333c4a;
    --wire:#4f9fc0; --wire-label:#aab4c2;
    --ok:#84c462; --ok-soft:#1f2f18; --warn:#dcb63c; --warn-soft:#372e12;
    --crit:#e4716e; --crit-soft:#3a1e1d;
    --toolbar:#0c0e11; --toolbar-ink:#dfe2e6;
    --menubar-bg:rgba(28,29,33,.66); --menubar-border:rgba(255,255,255,.09);
    --menu-hover:rgba(255,255,255,.08); --menu-bg:rgba(42,43,48,.82);
    --menu-border:rgba(255,255,255,.10); --menu-accent:#0a84ff;
  }}
  :root[data-theme="dark"]{
    --ground:#0f1113; --canvas:#15181d; --surface:#1c2026; --surface-2:#232830;
    --ink:#e7eae6; --ink-2:#b2b8ae; --ink-3:#868c82;
    --rule:#2f343c; --rule-2:#262b32;
    --accent:#79aede; --accent-soft:#1a2c3c;
    --node-head-1:#20304f; --node-head-2:#2a3c63; --node-head-ink:#dbe4f5;
    --node-body:#222834; --node-border:#333c4a;
    --wire:#4f9fc0; --wire-label:#aab4c2;
    --ok:#84c462; --ok-soft:#1f2f18; --warn:#dcb63c; --warn-soft:#372e12;
    --crit:#e4716e; --crit-soft:#3a1e1d;
    --toolbar:#0c0e11; --toolbar-ink:#dfe2e6;
    --menubar-bg:rgba(28,29,33,.66); --menubar-border:rgba(255,255,255,.09);
    --menu-hover:rgba(255,255,255,.08); --menu-bg:rgba(42,43,48,.82);
    --menu-border:rgba(255,255,255,.10); --menu-accent:#0a84ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}

  /* ── macOS 스타일 메뉴바 (프로스티드 글래스) ── */
  .menubar{display:flex;align-items:center;gap:1px;height:40px;padding:0 12px;flex:0 0 auto;
           background:var(--menubar-bg);
           -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
           border-bottom:1px solid var(--menubar-border);position:relative;z-index:50}
  .mb-app{font-weight:700;font-size:14px;letter-spacing:-.01em;color:var(--ink);
          padding:0 14px 0 4px;display:flex;align-items:center}
  .mb-app img{height:22px;width:auto;display:block}
  .mb-app b{color:var(--accent)}
  .mb-menu{position:relative}
  .mb-title{font:inherit;font-size:13px;color:var(--ink);background:none;border:none;
            padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .mb-title:hover{background:var(--menu-hover)}
  .mb-menu.open .mb-title{background:var(--menu-accent);color:#fff}
  .mb-dd{position:absolute;top:calc(100% + 5px);left:0;min-width:206px;z-index:60;
         background:var(--menu-bg);
         -webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
         border:1px solid var(--menu-border);border-radius:10px;
         box-shadow:0 14px 44px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.12);padding:5px}
  .mb-item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 11px;
           border:none;background:none;border-radius:6px;font:inherit;font-size:13px;
           color:var(--ink);text-align:left;cursor:pointer;white-space:nowrap}
  .mb-item:hover{background:var(--menu-accent);color:#fff}
  .mb-item i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
  .mb-item .sc{margin-left:auto;font-size:11px;opacity:.5;font-family:var(--mono)}
  .mb-label{font-size:11px;color:var(--ink-3);padding:7px 11px 3px;font-weight:600}
  .mb-div{height:1px;background:var(--menu-border);margin:5px 8px}
  .mb-right{margin-left:auto;display:flex;align-items:center;gap:13px}
  .mb-status{font-size:12px;color:var(--ink-3);font-family:var(--mono);
             max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mb-ai{font:inherit;font-size:12.5px;font-weight:600;color:#fff;
         background:linear-gradient(180deg,#3a90ff,#2b6fe0);border:none;border-radius:7px;
         padding:6px 13px;cursor:pointer;box-shadow:0 1px 2px rgba(43,111,224,.5);white-space:nowrap}
  .mb-ai:hover{filter:brightness(1.06)}
  .mb-ai:active{transform:translateY(1px)}
  .mb-ai.busy{opacity:.72;pointer-events:none}
  .mb-ai.busy::after{content:"";display:inline-block;width:9px;height:9px;margin-left:6px;
    border:2px solid rgba(255,255,255,.6);border-top-color:transparent;border-radius:50%;
    animation:spin .7s linear infinite;vertical-align:-1px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .clock{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .conn{display:flex;align-items:center;gap:6px;font-size:12px;font-family:var(--mono);color:var(--ink-2)}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .conn.live .dot{background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.22)}
  .conn.dead .dot{background:#ff453a;box-shadow:0 0 0 3px rgba(255,69,58,.22)}

  /* ── 본체: 캔버스 | 인스펙터 (좌측바 없음) ── */
  .body{flex:1 1 auto;display:flex;min-height:0}

  .canvas{flex:1 1 auto;position:relative;overflow:auto;background:var(--canvas);
    background-image:radial-gradient(var(--rule-2) 1px, transparent 1px);
    background-size:22px 22px}
  .graph{position:relative;min-width:100%;min-height:100%}
  .graph svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .wirepath{fill:none;stroke:var(--wire);stroke-width:2}
  .wirepath.flow{stroke-dasharray:5 6;animation:flow 1s linear infinite}
  .wirepath.off{stroke:var(--rule);stroke-dasharray:3 5}
  .wirepath.sel{stroke:var(--sel)!important;stroke-width:3.5;stroke-dasharray:none;filter:drop-shadow(0 0 3px var(--sel));animation:none}
  /* 직접 그린 연결도 자동 배선과 같은 점선·흐름으로 통일 */
  .wirepath.user{stroke:var(--wire);stroke-width:2;stroke-dasharray:5 6;animation:flow 1s linear infinite;pointer-events:none}
  .wirepath.temp{stroke:var(--sel);stroke-width:2;stroke-dasharray:4 4;opacity:.85}
  .wirehit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
  .wire-del{cursor:pointer;pointer-events:all}
  .wire-del circle.hit{fill:transparent;stroke:none}
  .wire-del circle:not(.hit){fill:var(--crit);stroke:var(--surface);stroke-width:1.5}
  .wire-del path{stroke:#fff;stroke-width:2;stroke-linecap:round;pointer-events:none}
  .wire-del:hover circle:not(.hit){fill:#c81f1c}
  .port,.headport{cursor:crosshair;transition:box-shadow .08s,transform .08s}
  /* 자석: 드래그 중 붙는 대상 포트 강조 (또렷한 링 + 확대, 글로우 없음) */
  .port.snap{transform:translateY(-50%) scale(1.7);box-shadow:0 0 0 3px var(--canvas),0 0 0 5px var(--accent)}
  .headport.snap{transform:translateY(-50%) scale(1.7);box-shadow:0 0 0 3px var(--node-head-1),0 0 0 5px var(--accent)}
  @keyframes flow{to{stroke-dashoffset:-11}}
  .wirelabel{fill:var(--wire-label);font:600 10px var(--mono);
             paint-order:stroke;stroke:var(--canvas);stroke-width:3px}

  /* ── 노드 카드 (SmartRay풍 조밀 카드) ── */
  .node{position:absolute;width:158px;background:var(--node-body);
        border:1px solid var(--node-border);border-radius:5px;
        box-shadow:0 1px 3px rgba(20,24,32,.14);user-select:none}
  .node.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel),0 2px 7px rgba(20,24,32,.22)}
  .node .nhead{display:flex;align-items:center;gap:5px;padding:4px 8px;cursor:grab;
    background:linear-gradient(180deg,var(--node-head-2),var(--node-head-1));
    color:var(--node-head-ink);border-radius:4px 4px 0 0;position:relative}
  .node .nhead:active{cursor:grabbing}
  .node .ntitle{font-weight:600;font-size:11px;letter-spacing:-.01em;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .nkind{font:600 7.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;
               color:#aeb9d4;margin-left:auto;flex:0 0 auto}
  .node .nbody{padding:3px 0}
  .prow{display:flex;align-items:center;gap:5px;padding:2px 8px;position:relative;min-height:18px}
  .prow .pname{font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pval{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
              font-variant-numeric:tabular-nums;white-space:nowrap}
  .prow .pval.ok{color:var(--ink)} .prow .pval.warn{color:var(--warn)}
  .prow .pval.crit{color:var(--crit)} .prow .pval.stale{color:var(--ink-3)}
  .punit{font-size:8px;color:var(--ink-3);margin-left:2px;font-weight:400}
  /* 값 pill (SmartRay 타입 pill 자리 = 실시간 값) */
  .vpill{margin-left:auto;display:inline-flex;align-items:baseline;gap:2px;cursor:pointer;
         font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:3px;
         background:var(--surface-2);border:1px solid var(--rule);font-variant-numeric:tabular-nums}
  .vpill .u{font-size:8px;color:var(--ink-3);font-weight:400}
  .vpill:hover{border-color:var(--accent)}
  .vpill.ok .v{color:var(--ink)}
  .vpill.warn{background:var(--warn-soft);border-color:var(--warn)} .vpill.warn .v{color:var(--warn)}
  .vpill.crit{background:var(--crit-soft);border-color:var(--crit)} .vpill.crit .v{color:var(--crit)}
  .vpill.stale .v{color:var(--ink-3)}
  /* 포트 점: 카드 가장자리에 물림 */
  .port{width:11px;height:11px;border-radius:50%;border:2px solid var(--node-body);
        position:absolute;top:50%;transform:translateY(-50%);z-index:3}
  .port.in{left:-6px} .port.out{right:-6px}
  /* 잡기 쉽도록 투명한 넓은 히트영역(보이는 점은 그대로) */
  .port::before,.headport::before{content:"";position:absolute;inset:-9px;border-radius:50%}
  .port.sensor{background:var(--port-sensor)} .port.data{background:var(--port-data)}
  .port.agg{background:var(--port-agg)}
  /* 연결 상태 색: 빈 점(노랑) · 연결·정상(초록) · 연결·접속안됨(빨강) */
  .port.p-empty,.headport.p-empty{background:#e6b422}
  .port.p-live,.headport.p-live{background:#30d158}
  .port.p-dead,.headport.p-dead{background:#ff453a}
  .headport{position:absolute;top:50%;right:-6px;transform:translateY(-50%);
            width:11px;height:11px;border-radius:50%;border:2px solid var(--node-head-1);z-index:3}
  .npill{font:600 8px var(--mono);letter-spacing:.04em;text-transform:uppercase;
         padding:1px 5px;border-radius:3px;border:1px solid currentColor}
  .npill.on{background:var(--ok-soft);color:var(--ok)}
  .npill.off{background:var(--crit-soft);color:var(--crit)}
  .nsub{padding:2px 8px 5px;font-size:9.5px;color:var(--ink-3);font-family:var(--mono)}
  .guess{display:inline-block;font:600 7.5px var(--mono);letter-spacing:.03em;
         color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn);
         border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px}
  /* ── AI 자동연결 등장 연출 ── */
  .node.reveal-hide{opacity:0;transform:scale(.88);pointer-events:none}
  /* 부드러운 감속(ease-out-quint). 산업용 화면이라 튕기는 연출은 쓰지 않는다. */
  .node.reveal-in{animation:nodepop .42s cubic-bezier(.22,1,.36,1)}
  @keyframes nodepop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  /* 배선이 그려지는 연출(양 끝이 나타난 순간 1회) */
  @keyframes wiredraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .wirepath.draw{stroke-dasharray:100!important;stroke-dashoffset:100;
                 animation:wiredraw .5s ease forwards!important}
  @media (prefers-reduced-motion:reduce){
    .node.reveal-in{animation:none}
    .wirepath.draw{animation:none!important;stroke-dashoffset:0}
  }
  .node.guess-node{border-style:dashed}
  .node.disabled-node{opacity:.5;border-style:dashed}
  /* 전원 꺼짐: 회색조 + "전원 꺼짐" 워터마크 */
  .node.node-off{opacity:.6;filter:grayscale(.65)}
  .node.node-off::after{content:"⏻ 전원 꺼짐";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font:700 10px var(--mono);letter-spacing:.04em;
    color:#ff453a;background:rgba(10,12,16,.34);border-radius:5px;z-index:6;pointer-events:none}
  /* 재시작 모션: 중앙 스피너 + '재시작 중' */
  @keyframes jcc-spin{to{transform:rotate(360deg)}}
  .node.restarting::before{content:"";position:absolute;top:50%;left:50%;width:24px;height:24px;
    margin:-16px 0 0 -12px;border:2.5px solid #e6b422;border-top-color:transparent;border-radius:50%;
    z-index:7;pointer-events:none;animation:jcc-spin .7s linear infinite}
  .node.restarting::after{content:"재시작 중…";position:absolute;left:0;right:0;bottom:7px;text-align:center;
    font:700 9px var(--mono);letter-spacing:.03em;color:#e6b422;z-index:7;pointer-events:none}
  .node.restarting{box-shadow:0 0 0 2px #e6b422,0 2px 7px rgba(20,24,32,.22)}
  @media (prefers-reduced-motion:reduce){.node.restarting::before{animation:none}}
  .offbadge{display:inline-block;font:600 7.5px var(--mono);letter-spacing:.03em;
            color:var(--ink-3);background:var(--surface-2);border:1px solid var(--rule);
            border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px}
  .nsource{padding:0 8px 5px;font-size:9px;color:var(--ink-3);font-family:var(--mono);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── 인스펙터 ── */
  .inspector{flex:0 0 0;width:0;background:var(--surface);border-left:1px solid var(--rule);
             overflow:hidden;transition:flex-basis .16s ease}
  .inspector.open{flex-basis:308px;width:308px}
  .insp-in{width:308px;padding:16px 18px;box-sizing:border-box;height:100%;overflow-y:auto;overscroll-behavior:contain}
  .insp-kind{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .insp-title{font-weight:700;font-size:17px;margin:2px 0 12px;letter-spacing:-.01em}
  .insp-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
            border-bottom:1px solid var(--rule);font-size:12.5px}
  .insp-row .k{color:var(--ink-3);flex:none} .insp-row .v{font-family:var(--mono);text-align:right;word-break:break-word}
  .insp-close{float:right;background:none;border:none;font-size:18px;color:var(--ink-3);cursor:pointer;line-height:1}
  /* 제품 카드(사진·브랜드·품번) */
  .insp-photo{display:flex;align-items:center;justify-content:center;height:96px;margin:2px 0 10px;
              background:var(--canvas);border:1px solid var(--rule);border-radius:8px;color:var(--accent)}
  .insp-photo svg{width:66px;height:66px}
  /* 실제 제품 사진이 있으면 도식 대신 사진을 쓴다 */
  .insp-photo img.pphoto{max-height:92px;max-width:100%;object-fit:contain;border-radius:6px}
  /* 릴레이 접점 */
  .relay{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
  .relay .rid{flex:none;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;
              justify-content:center;font:700 10px var(--mono);background:var(--surface-2);color:var(--ink-2)}
  .relay .rbody{flex:1 1 auto;min-width:0}
  .relay .rrole{font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .relay .rstate{font:600 10px var(--mono);margin-top:2px;color:var(--ok,#2f9e54)}
  .relay .rstate.bad{color:var(--crit)}
  .relay select{flex:none;font:600 10px var(--mono);padding:3px 4px;border-radius:5px;
                background:var(--canvas);border:1px solid var(--rule);color:var(--ink)}
  .insp-brand{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin:-6px 0 2px}
  /* 현재 측정값 하이라이트 */
  .insp-live{display:flex;align-items:baseline;gap:6px;margin:10px 0 4px;padding:10px 12px;
             background:var(--canvas);border:1px solid var(--rule);border-radius:8px}
  .insp-live .lv{font:700 26px var(--mono);letter-spacing:-.02em}
  .insp-live .lu{font-size:12px;color:var(--ink-3)}
  .insp-live .lk{margin-left:auto;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  /* 설정/알람 입력 */
  .insp-sec{margin:12px 0 4px;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .insp-set{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px}
  .insp-set label{color:var(--ink-3);flex:1}
  .insp-set input{width:78px;font:600 12.5px var(--mono);text-align:right;padding:5px 7px;
                  background:var(--canvas);border:1px solid var(--rule);border-radius:6px;color:var(--ink)}
  .insp-set input:focus{outline:none;border-color:var(--accent)}
  .insp-set input.wide{width:100%;text-align:left;font-family:var(--sans);font-size:13px;font-weight:600}
  .insp-set .un{width:26px;font-size:11px;color:var(--ink-3)}
  .insp-btn{width:100%;margin-top:8px;padding:8px;border:1px solid var(--accent);border-radius:7px;
            background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer}
  .insp-btn:hover{filter:brightness(1.06)} .insp-btn.saved{background:var(--canvas);color:var(--accent)}
  .insp-btnrow{display:flex;gap:8px;margin-top:8px}
  .insp-btnrow .insp-btn{margin-top:0}

<script src="demo-api.js?v=8b05a780"></script>
<script>
const $ = s => document.querySelector(s);
const REFRESH_MS = 3000;
const LS_POS = "jcc-node-pos-v1";
const LS_USER = "jcc-user-nodes-v1";
const LS_WIRES = "jcc-user-wires-v1";

// 팔레트로 추가할 수 있는 노드 종류
const KIND_KO  = {sensor:"센서",ccm:"CCM 게이트웨이",panel:"판넬",threshold:"임계값 경보",
                  aggregate:"상태 집계",server:"JCC 클라우드",notify:"알림",store:"데이터 저장"};
const KIND_TAG = {sensor:"SENSOR",ccm:"CCM",panel:"PANEL",threshold:"ALERT",
                  aggregate:"AGG",server:"CLOUD",notify:"NOTIFY",store:"STORE"};
const KIND_PORT= {sensor:"sensor",ccm:"data",panel:"agg",threshold:"data",
                  aggregate:"agg",server:"data",notify:"data",store:"data"};

// ── 유틸 ──────────────────────────────────────────────
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtValue(v){ return v===null||v===undefined ? "—" : (Math.round(v*100)/100).toString(); }
function ago(ts){ if(!ts) return ""; const s=Math.max(0,Math.floor(Date.now()/1000-ts));
  if(s<60) return s+"초 전"; if(s<3600) return Math.floor(s/60)+"분 전"; return Math.floor(s/3600)+"시간 전"; }
function severity(key,v,rec){ if(v===null||v===undefined) return "";
  // 프로파일에 기준값이 있으면 그것을 쓴다(2단계: 위험 > 경고 > 정상)
  if(rec && (rec.alarm_max!==null&&rec.alarm_max!==undefined || rec.alarm_warn!==null&&rec.alarm_warn!==undefined)){
    if((rec.alarm_max!==null&&rec.alarm_max!==undefined && v>rec.alarm_max) ||
       (rec.alarm_min!==null&&rec.alarm_min!==undefined && v<rec.alarm_min)) return "crit";
    if(rec.alarm_warn!==null&&rec.alarm_warn!==undefined && v>rec.alarm_warn) return "warn";
    return "";
  }
  key=key.toLowerCase();
  if(key.includes("h2"))   return v>=2 ? "crit" : (v>=1 ? "warn" : "");
  if(key.includes("temp")) return v>=45 ? "crit" : (v>=38 ? "warn" : "");
  if(key.includes("vibr")) return v>=4 ? "crit" : (v>=2.5 ? "warn" : "");
  return ""; }
function loadPos(){ try{ return JSON.parse(localStorage.getItem(LS_POS)||"{}"); }catch(e){ return {}; } }
function savePos(p){ try{ localStorage.setItem(LS_POS, JSON.stringify(p)); }catch(e){} }

// ── 상태 ──────────────────────────────────────────────
let nodePos = loadPos();       // {nodeId: {x,y}}  사용자 배치
let nodes = new Map();         // nodeId -> {el, kind}
let wires = [];                // {fromId, toId, label, live}
let topoSig = "";
let selectedId = null;
let sensorMeta = {};           // "device:key" -> {source, confidence}  탐지 메타
let sensorRec = {};            // "device:key" -> 전체 센서 레코드(제품정보·알람·설정)
let nodeOnline = {};           // nodeId -> bool  노드 온라인 상태(포트 색 판정용)
let clientOff = new Set();     // 사용자가 전원 끈 노드(ccm:...) — 화면에 '전원 꺼짐' 유지
// AI 자동연결 등장 연출: revealSet이 있으면 그 안의 노드만 보이고, 양 끝이 다 보이는
// 배선만 그린다(=아직 안 나온 장비의 선은 숨김). null이면 평소처럼 전부 표시.
let revealSet = null;
let revealing = false;
let pendingReveal = false;     // [AI 자동연결] 직후 한 번만 연출
let drawnWires = new Set();    // 그리기 애니메이션을 이미 보여준 배선

// 포트가 속한 노드 id (연출 중 배선 표시 판정용)
function portNodeId(portId){
  const el = $(`.graph [data-port="${cssAttr2(portId)}"]`);
  return el ? (el.closest(".node")?.dataset.id || null) : null;
}
function wireShown(fromId, toId){
  if(!revealSet) return true;
  const a = portNodeId(fromId), b = portNodeId(toId);
  return !!(a && b && revealSet.has(a) && revealSet.has(b));
}
let userNodes = loadUser();    // [{id,kind,name}]  팔레트로 추가한 노드
let userCounter = userNodes.reduce((m,n)=>Math.max(m, +((n.id.split(":")[2])||0)),0);
function loadUser(){ try{ return JSON.parse(localStorage.getItem(LS_USER)||"[]"); }catch(e){ return []; } }
function saveUser(){ try{ localStorage.setItem(LS_USER, JSON.stringify(userNodes)); }catch(e){} }

let userWires = loadWires();   // [{id,from,to}]  포트를 끌어 만든 연결
let wireCounter = userWires.reduce((m,w)=>Math.max(m, +((w.id||"w0").slice(1))||0),0);
let wiring = null;             // 드래그 중 {fromId, fromNode}
let tempPt = null;             // 드래그 중 커서 위치(그래프 좌표)
let snapPort = null;           // 자석: 가까이 붙은 대상 포트 {el,id,node,x,y}
const SNAP_RADIUS = 38;        // 이 거리 안이면 포트에 착 붙는다
let selectedWireId = null;
function loadWires(){ try{ return JSON.parse(localStorage.getItem(LS_WIRES)||"[]"); }catch(e){ return []; } }
function saveWires(){ try{ localStorage.setItem(LS_WIRES, JSON.stringify(userWires)); }catch(e){} }

// 센서 채널 활성/비활성 = CCM에 보내는 실제 명령(SW·HW 일치).
function setChannel(dev, key, enabled){
  return fetch("/api/channel", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({device_id:dev, sensor_key:key, enabled})})
    .then(r=>r.json());
}
function enableAllChannels(){
  return fetch("/api/channels/enable-all", {method:"POST"}).then(r=>r.json());
}

// ── 데이터 → 그래프 ───────────────────────────────────
function topoSignature(panels){
  return panels.map(p=>p.panel+"["+(p.ccms||[]).map(c=>c.device_id+":"+(c.latest||[]).map(r=>r.sensor_key).join(",")).join(";")+"]").join("|");
}

function refresh(){
  fetch("/api/panels",{cache:"no-store"}).then(r=>{
    if(!r.ok) throw 0; return r.json();
  }).then(data=>{
    setConn(true);
    const panels = data.panels||[];
    $("#empty").style.display = panels.length ? "none" : "flex";
    const sig = topoSignature(panels);
    // 연출 중 노드를 새로 만들면 연출이 잡고 있던 노드가 사라져 뒤엉킨다.
    // topoSig를 그대로 두므로 연출이 끝난 직후 정상적으로 재구성된다.
    if(sig !== topoSig && !revealing){
      buildGraph(panels); topoSig = sig;
      if(pendingReveal && panels.length){    // [AI 자동연결] 직후 한 번만 연출
        pendingReveal = false;
        runReveal(panels);
        return;                              // 연출이 화면을 직접 그린다
      }
    }
    updateValues(panels);
    if(!revealing) requestAnimationFrame(drawWires);   // 연출 중에는 끼어들지 않는다
  }).catch(()=> setConn(false));
}

function setConn(ok){
  const c = $("#conn");
  c.className = "conn " + (ok?"live":"dead");
  $("#conn-t").textContent = ok ? "실시간" : "서버 응답 없음";
}

// 노드 DOM 생성 (토폴로지 변경 시에만)
function buildGraph(panels){
  const graph = $("#graph");
  // 기존 노드 제거 (wires svg, empty는 보존)
  graph.querySelectorAll(".node").forEach(n=>n.remove());
  nodes.clear(); wires = []; sensorMeta = {}; sensorRec = {};

  const SERVER_ID = "server:jcc";
  // 서버 노드 1개
  const serverEl = mkNode(SERVER_ID, "server", "JCC 클라우드", "CLOUD");
  serverEl.querySelector(".nbody").innerHTML =
    `<div class="prow"><span class="port in data" data-port="in:server"></span>`+
    `<span class="pname">텔레메트리 수신</span></div>`+
    `<div class="nsub" data-role="server-sub">판넬 –</div>`;
  graph.appendChild(serverEl); nodes.set(SERVER_ID,{el:serverEl,kind:"server"});

  for(const p of panels){
    const panelId = "panel:"+p.panel;
    const pEl = mkNode(panelId, "panel", p.panel_name||p.panel, "PANEL");
    // 헤더 우측 출력 포트 + 온라인 pill
    pEl.querySelector(".nhead").insertAdjacentHTML("beforeend",
      `<span class="npill off" data-role="pill">OFF</span><span class="headport" data-port="out:panel:${cssAttr(p.panel)}"></span>`);
    let pbody = "";
    for(const c of (p.ccms||[])){
      pbody += `<div class="prow"><span class="port in agg" data-port="in:panel:${cssAttr(p.panel)}:${cssAttr(c.device_id)}"></span>`+
        `<span class="pname">${escapeHtml(c.device_id)}</span>`+
        `<span class="npill off" data-role="cpill:${cssAttr(c.device_id)}">OFF</span></div>`;
    }
    pEl.querySelector(".nbody").innerHTML = pbody;
    graph.appendChild(pEl); nodes.set(panelId,{el:pEl,kind:"panel"});
    wires.push({fromId:"out:panel:"+p.panel, toId:"in:server", label:"MQTT"});

    for(const c of (p.ccms||[])){
      const ccmId = "ccm:"+c.device_id;
      const cEl = mkNode(ccmId, "ccm", c.device_id, "CCM");
      cEl.querySelector(".nhead").insertAdjacentHTML("beforeend",
        `<span class="npill off" data-role="pill">OFF</span><span class="headport" data-port="out:ccm:${cssAttr(c.device_id)}"></span>`);
      let cbody = "";
      for(const r of (c.latest||[])){
        cbody += `<div class="prow"><span class="port in sensor" data-port="in:ccm:${cssAttr(c.device_id)}:${cssAttr(r.sensor_key)}"></span>`+
          `<span class="pname">${escapeHtml(r.name||r.sensor_key)}</span>`+
          `<span class="pval stale" data-role="cv:${cssAttr(r.sensor_key)}">—</span></div>`;
      }
      cEl.querySelector(".nbody").innerHTML = cbody || `<div class="nsub">센서 없음</div>`;
      graph.appendChild(cEl); nodes.set(ccmId,{el:cEl,kind:"ccm"});
      wires.push({fromId:"out:ccm:"+c.device_id, toId:"in:panel:"+p.panel+":"+c.device_id, label:"이더넷"});

      for(const r of (c.latest||[])){
        const sId = "sensor:"+c.device_id+":"+r.sensor_key;
        sensorMeta[c.device_id+":"+r.sensor_key] = {source:r.source||"", confidence:r.confidence||""};
        sensorRec[c.device_id+":"+r.sensor_key] = {...r, device_id:c.device_id};
        const guess = r.confidence === "추정";
        const disabled = r.enabled === false;   // CCM에서 채널이 꺼진 센서
        const sEl = mkNode(sId, "sensor", r.name||r.sensor_key, "SENSOR");
        if(guess) sEl.classList.add("guess-node");
        if(disabled){ sEl.classList.add("disabled-node"); sEl.classList.add("node-off"); }
        if(guess) sEl.querySelector(".nhead").insertAdjacentHTML("beforeend", `<span class="guess">추정</span>`);
        if(disabled) sEl.querySelector(".nhead").insertAdjacentHTML("beforeend", `<span class="offbadge">꺼짐</span>`);
        sEl.querySelector(".nbody").innerHTML =
          `<div class="prow"><span class="pname">실시간</span>`+
            `<span class="vpill stale" data-role="sv" title="클릭하면 이력"><b class="v">—</b><span class="u">${escapeHtml(r.unit||"")}</span></span>`+
            `<span class="port out sensor" data-port="out:sensor:${cssAttr(c.device_id)}:${cssAttr(r.sensor_key)}"></span></div>`+
          (r.source?`<div class="nsource">${escapeHtml(r.source)}</div>`:"");
        sEl.querySelector(".vpill").onclick = (e)=>{ e.stopPropagation();
          openChart(c.device_id, r.sensor_key, r.name||r.sensor_key, r.unit||""); };
        graph.appendChild(sEl); nodes.set(sId,{el:sEl,kind:"sensor"});
        if(!disabled)   // 비활성 채널은 배선을 만들지 않는다(하드웨어에서도 끊긴 상태)
          wires.push({fromId:"out:sensor:"+c.device_id+":"+r.sensor_key,
                      toId:"in:ccm:"+c.device_id+":"+r.sensor_key, label:"RS485"});
      }
    }
  }
  autoLayout(panels);        // 저장된 배치 없으면 자동 정렬
  applyPositions();
  renderUserNodes();         // 팔레트로 추가한 노드는 토폴로지 재생성 후에도 유지
}

function mkNode(id, kind, title, kindLabel){
  const el = document.createElement("div");
  el.className = "node " + kind; el.dataset.id = id;
  el.innerHTML = `<div class="nhead"><span class="ntitle">${escapeHtml(title)}</span><span class="nkind">${kindLabel}</span></div><div class="nbody"></div>`;
  makeDraggable(el);
  el.addEventListener("mousedown", ()=>select(id), true);
  return el;
}
function cssAttr(s){ return String(s).replace(/[^a-zA-Z0-9_:.-]/g,"_"); }

// ── 자동 배치 (티어: 센서→CCM→판넬→서버) ───────────────
const TIER_X = {sensor:24, ccm:250, panel:500, server:740};
const GAP_Y = 14;
function autoLayout(panels){
  const auto = {};
  let sy = 24;                    // 센서 세로 커서
  const ccmY = {}, panelY = {};
  for(const p of panels){
    const ccmCenters = [];
    for(const c of (p.ccms||[])){
      const sensors = c.latest||[];
      const first = sy;
      for(const r of sensors){
        auto["sensor:"+c.device_id+":"+r.sensor_key] = {x:TIER_X.sensor, y:sy};
        sy += nodeH("sensor") + GAP_Y;
      }
      const last = sy - GAP_Y;
      const cy = sensors.length ? (first + last)/2 - nodeH("ccm")/2 : sy;
      if(!sensors.length){ sy += nodeH("ccm") + GAP_Y; }
      auto["ccm:"+c.device_id] = {x:TIER_X.ccm, y:Math.max(24,cy)};
      ccmCenters.push(auto["ccm:"+c.device_id].y + nodeH("ccm")/2);
    }
    const py = ccmCenters.length ? avg(ccmCenters) - nodeH("panel")/2 : sy;
    auto["panel:"+p.panel] = {x:TIER_X.panel, y:Math.max(24,py)};
    panelY[p.panel] = py;
  }
  const pys = Object.values(panelY);
  auto["server:jcc"] = {x:TIER_X.server, y: (pys.length? avg(pys):40)};
  // 저장된 사용자 배치가 있으면 그것을 우선, 없으면 자동
  autoPositions = auto;
}
let autoPositions = {};
function avg(a){ return a.reduce((x,y)=>x+y,0)/a.length; }
function nodeH(kind){ return kind==="sensor"?72 : kind==="ccm"?96 : kind==="panel"?88 : 52; }

function applyPositions(){
  let maxR=0, maxB=0;
  for(const [id,{el}] of nodes){
    const pos = nodePos[id] || autoPositions[id] || {x:24,y:24};
    el.style.left = pos.x+"px"; el.style.top = pos.y+"px";
    maxR = Math.max(maxR, pos.x + el.offsetWidth);
    maxB = Math.max(maxB, pos.y + el.offsetHeight);
  }
  const g = $("#graph");
  g.style.width = (maxR+60)+"px"; g.style.height = (maxB+60)+"px";
}

// ── AI 자동연결 등장 연출 ─────────────────────────────
// 클라우드·판넬 → CCM → 센서 순서로 하나씩 나타나며 선이 이어진다.
// 자동 탐색이 '무엇을 어떤 순서로 찾아냈는지'를 눈으로 보여주는 연출.
async function runReveal(panels){
  if(revealing) return;          // 연출 중 또 누르면 두 연출이 겹쳐 뒤엉킨다
  const wait = (ms)=> new Promise(r=>setTimeout(r, ms));
  const redraw = ()=>{ colorPorts(); drawWires(); };
  const show = (id)=>{
    const n = nodes.get(id); if(!n) return;
    revealSet.add(id);
    n.el.classList.remove("reveal-hide");
    n.el.classList.add("reveal-in");
    setTimeout(()=> n.el.classList.remove("reveal-in"), 460);
  };

  revealing = true;
  revealSet = new Set();
  drawnWires = new Set();
  for(const [, n] of nodes){ if(!n.user) n.el.classList.add("reveal-hide"); }
  redraw();
  await wait(260);

  // 1) 클라우드 + 판넬부터
  show("server:jcc");
  for(const p of panels) show("panel:"+p.panel);
  redraw();
  setStatus("클라우드·판넬 인식됨");
  await wait(620);
  redraw();                       // 판넬 ↔ 클라우드 선이 이어지는 순간
  await wait(560);

  // 2) CCM을 한 대씩
  for(const p of panels){
    const ccms = p.ccms || [];
    for(let i=0; i<ccms.length; i++){
      show("ccm:"+ccms[i].device_id);
      redraw();
      setStatus(`CCM 발견 ${i+1}/${ccms.length} — ${ccms[i].device_id}`);
      await wait(430);
    }
  }
  await wait(260);

  // 3) 센서를 하나씩
  let sn = 0;
  for(const p of panels){
    for(const c of (p.ccms||[])){
      for(const r of (c.latest||[])){
        show("sensor:"+c.device_id+":"+r.sensor_key);
        redraw();
        sn++;
        setStatus(`센서 연결 ${sn} — ${r.name || r.sensor_key}`);
        await wait(170);
      }
    }
  }

  revealSet = null;               // 연출 끝 → 평소 표시로
  revealing = false;
  redraw();
  setStatus(`자동 연결 완료 — CCM ${panels.reduce((a,p)=>a+(p.ccms||[]).length,0)}대 · 센서 ${sn}개`);
}

// ── 값·상태 갱신 (제자리) ─────────────────────────────
function updateValues(panels){
  let onlinePanels = 0, lastSeen = 0;
  nodeOnline = {};
  for(const p of panels){
    if(p.online) onlinePanels++;
    nodeOnline["panel:"+p.panel] = p.online;
    const pEl = nodes.get("panel:"+p.panel)?.el; if(!pEl) continue;
    setPill(pEl.querySelector('[data-role="pill"]'), p.online);
    for(const c of (p.ccms||[])){
      lastSeen = Math.max(lastSeen, c.last_seen||0);
      const ccmId = "ccm:"+c.device_id;
      const forcedOff = clientOff.has(ccmId);        // 사용자가 전원 끈 CCM
      const cOnline = c.online && !forcedOff;
      nodeOnline[ccmId] = cOnline;
      const cpill = pEl.querySelector(`[data-role="cpill:${cssAttr(c.device_id)}"]`);
      setPill(cpill, cOnline);
      const cEl = nodes.get(ccmId)?.el; if(!cEl) continue;
      setPill(cEl.querySelector('[data-role="pill"]'), cOnline);
      cEl.classList.toggle("node-off", forcedOff);   // 전원 꺼짐 워터마크
      for(const r of (c.latest||[])){
        nodeOnline["sensor:"+c.device_id+":"+r.sensor_key] = cOnline;
        // CCM이 꺼져 있으면 그 아래 센서도 전원이 끊긴 것 → 값은 마지막 값으로 얼리고 흐리게.
        const sev = forcedOff ? "stale" : (severity(r.sensor_key, r.value, r) || (r.ok?"ok":"stale"));
        // CCM 안 입력행 값
        const cv = cEl.querySelector(`[data-role="cv:${cssAttr(r.sensor_key)}"]`);
        if(cv){ cv.className = "pval "+sev;
          if(!forcedOff) cv.innerHTML = fmtValue(r.value)+`<span class="punit">${escapeHtml(r.unit||"")}</span>`; }
        // 센서 노드 큰 값
        const sEl = nodes.get("sensor:"+c.device_id+":"+r.sensor_key)?.el;
        if(sEl){ sEl.classList.toggle("node-off", forcedOff);   // 꺼진 CCM의 센서도 '전원 꺼짐'
          const bv=sEl.querySelector('[data-role="sv"]');
          bv.className = "vpill "+sev;
          if(!forcedOff) bv.querySelector(".v").textContent = fmtValue(r.value); }
        // 인스펙터 열려있으면 현재값·상태 실시간 갱신
        const rec = sensorRec[c.device_id+":"+r.sensor_key];
        if(rec){ rec.value = r.value; rec.ok = r.ok; }
        if(selectedId === "sensor:"+c.device_id+":"+r.sensor_key) updateInspLive(r.value, r.unit, sev);
      }
    }
  }
  // 서버 노드 요약
  nodeOnline["server:jcc"] = onlinePanels > 0;
  const sSub = nodes.get("server:jcc")?.el.querySelector('[data-role="server-sub"]');
  if(sSub) sSub.textContent = `판넬 ${onlinePanels}/${panels.length} · ${ago(lastSeen)||"–"}`;
  // 배선 흐름 애니메이션 상태
  for(const w of wires){ w.live = true; }
  colorPorts();
}
function setPill(el, online){ if(!el) return;
  el.className = "npill " + (online?"on":"off"); el.textContent = online?"ON":"OFF"; }

// 포트 색: 연결 안 됨(노랑) · 연결·정상(초록) · 연결·접속안됨(빨강)
function colorPorts(){
  const connected = new Set();
  // 연출 중에는 '아직 안 이어진' 선은 연결로 치지 않는다 → 노랑(빈 점)에서 시작해
  // 선이 이어지는 순간 초록으로 바뀌는 게 눈에 보인다.
  for(const w of wires){ if(!wireShown(w.fromId, w.toId)) continue;
    connected.add(w.fromId); connected.add(w.toId); }
  for(const w of userWires){ connected.add(w.from); connected.add(w.to); }
  document.querySelectorAll(".graph .port, .graph .headport").forEach(el=>{
    const pid = el.getAttribute("data-port");
    const node = el.closest(".node");
    const online = node ? nodeOnline[node.dataset.id] : undefined;
    el.classList.remove("p-empty","p-live","p-dead");
    if(!connected.has(pid)) el.classList.add("p-empty");
    else if(online === false) el.classList.add("p-dead");
    else el.classList.add("p-live");
  });
}

// ── 배선 그리기 (포트 중심 실측) ───────────────────────
function portCenter(portId){
  const el = $(`.graph [data-port="${cssAttr2(portId)}"]`);
  if(!el) return null;
  const gr = $("#graph").getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left - gr.left + r.width/2, y: r.top - gr.top + r.height/2 };
}
function cssAttr2(s){ // data-port 값은 cssAttr로 안전화되어 저장됨 → 조회도 동일 변환
  return String(s).replace(/[^a-zA-Z0-9_:.-]/g,"_").replace(/["\\]/g,"\\$&"); }

function delMark(x,y,id){
  return `<g class="wire-del" data-wire-del="${id}" transform="translate(${x},${y})">`+
    `<circle class="hit" r="15"></circle>`+                       // 넓은 클릭영역(투명)
    `<circle r="10"></circle>`+
    `<path d="M-3.6,-3.6 L3.6,3.6 M3.6,-3.6 L-3.6,3.6"></path></g>`;
}
function drawWires(){
  const svg = $("#wires");
  let paths = "", labels = "", delBtns = "";
  // 자동 배선(현장 토폴로지). 클릭하면 선택·끊기 가능. 끊긴 것은 건너뛴다.
  for(const w of wires){
    const key = w.fromId+"|"+w.toId;
    if(!wireShown(w.fromId, w.toId)) continue;   // 연출 중: 아직 안 나온 장비의 선은 숨김
    const a = portCenter(w.fromId), b = portCenter(w.toId);
    if(!a || !b) continue;
    const dx = Math.max(36, (b.x - a.x)/2);
    const d = `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
    const wid = "auto:"+key, sel = wid===selectedWireId;
    // 이번에 처음 이어지는 선은 '그려지는' 애니메이션을 1회만 보여준다
    const fresh = revealSet && !drawnWires.has(key);
    if(fresh) drawnWires.add(key);
    const cls = "wirepath" + (w.live ? " flow" : " off") + (sel ? " sel" : "") + (fresh ? " draw" : "");
    paths += `<path class="wirehit" data-wire="${wid}" d="${d}"></path>`;
    paths += `<path class="${cls}"${fresh ? ' pathLength="100"' : ""} data-wire="${wid}" d="${d}"></path>`;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2 - 5;
    labels += `<text class="wirelabel" x="${mx}" y="${my}" text-anchor="middle">${escapeHtml(w.label)}</text>`;
    if(sel) delBtns += delMark((a.x+b.x)/2, (a.y+b.y)/2, wid);
  }
  // 사용자 배선 (포트를 끌어 만든 연결). 끝점이 아직 없으면 건너뛴다(파괴적 정리 금지).
  for(const w of userWires){
    const a = portCenter(w.from), b = portCenter(w.to);
    if(!a || !b) continue;
    const dx = Math.max(36, Math.abs(b.x - a.x)/2);
    const d = `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
    const sel = w.id===selectedWireId;
    paths += `<path class="wirehit" data-wire="${w.id}" d="${d}"></path>`;   // 넓은 클릭영역
    paths += `<path class="wirepath user${sel?" sel":""}" data-wire="${w.id}" d="${d}"></path>`;
    if(sel) delBtns += delMark((a.x+b.x)/2, (a.y+b.y)/2, w.id);   // 끊기(✕) 버튼
  }
  labels += delBtns;
  // 드래그 중 임시선
  if(wiring && tempPt){
    const a = portCenter(wiring.fromId);
    if(a){ const dx = Math.max(36, Math.abs(tempPt.x - a.x)/2);
      paths += `<path class="wirepath temp" d="M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${tempPt.x-dx} ${tempPt.y}, ${tempPt.x} ${tempPt.y}"></path>`; }
  }
  svg.innerHTML = paths + labels;
  colorPorts();
}

// ── 드래그 ────────────────────────────────────────────
function makeDraggable(el){
  const head = ()=>el.querySelector(".nhead");
  let sx,sy,ox,oy,drag=false;
  el.querySelector(".nhead") || 0;
  el.addEventListener("mousedown", e=>{
    if(!e.target.closest(".nhead")) return;
    drag=true; sx=e.clientX; sy=e.clientY;
    ox=parseFloat(el.style.left)||0; oy=parseFloat(el.style.top)||0;
    el.style.zIndex=10; e.preventDefault();
  });
  window.addEventListener("mousemove", e=>{
    if(!drag) return;
    const nx=Math.max(0,ox+(e.clientX-sx)), ny=Math.max(0,oy+(e.clientY-sy));
    el.style.left=nx+"px"; el.style.top=ny+"px";
    drawWires();
  });
  window.addEventListener("mouseup", ()=>{
    if(!drag) return; drag=false; el.style.zIndex="";
    nodePos[el.dataset.id] = {x:parseFloat(el.style.left)||0, y:parseFloat(el.style.top)||0};
  });
}

// ── 배선 드래그 (포트 → 포트 연결) ────────────────────
// #graph의 캡처 단계에서 포트 mousedown을 먼저 가로채, 노드 드래그/선택보다 우선한다.
$("#graph").addEventListener("mousedown", e=>{
  const portEl = e.target.closest("[data-port]");
  if(!portEl) return;
  e.stopPropagation(); e.preventDefault();
  wiring = { fromId: portEl.getAttribute("data-port"), fromNode: portEl.closest(".node")?.dataset.id };
  document.body.style.cursor = "crosshair";
}, true);
// 포트 id를 해석: 종류·소속 장비/판넬을 뽑는다.
function parsePort(pid){
  if(pid.startsWith("uin:") || pid.startsWith("uout:")) return {kind:"user"};
  const p = pid.split(":");           // 예: out:sensor:ccm-2661:h2_lel
  const kind = p[1];
  if(kind==="sensor") return {kind, dev:p[2], key:p[3]};
  if(kind==="ccm")    return {kind, dev:p[2]};                 // in:ccm:DEV:KEY / out:ccm:DEV
  if(kind==="panel")  return {kind, panel:p[2], dev:p[3]};     // in:panel:PANEL:DEV / out:panel:PANEL
  if(kind==="server") return {kind:"server"};
  return {kind:"unknown"};
}

// 연결이 물리 토폴로지에 맞는지 검사. 어긋나면 막는다.
function validateConnection(fromId, toId){
  const A = parsePort(fromId), B = parsePort(toId);
  // 사용자가 직접 추가한 노드가 하나라도 끼면 자유 연결(설계용)
  if(A.kind==="user" || B.kind==="user") return {ok:true};
  const pair = [A.kind, B.kind].sort().join("-");
  if(pair==="ccm-sensor"){
    const s = A.kind==="sensor"?A:B, c = A.kind==="ccm"?A:B;
    if(s.dev !== c.dev)
      return {ok:false, reason:`이 센서는 ${s.dev}에 물려 있어 ${c.dev}에는 연결할 수 없습니다`};
    return {ok:true};
  }
  if(pair==="ccm-panel"){
    const c = A.kind==="ccm"?A:B, p = A.kind==="panel"?A:B;
    if(!p.dev) return {ok:false, reason:"판넬 출력에는 CCM을 연결할 수 없습니다"};
    if(c.dev !== p.dev)
      return {ok:false, reason:`이 CCM(${c.dev})은 그 판넬 자리에 연결할 수 없습니다`};
    return {ok:true};
  }
  if(pair==="panel-server") return {ok:true};
  return {ok:false, reason:"연결할 수 없는 조합입니다 (센서→CCM→판넬→클라우드 순서만 가능)"};
}

// 커서에서 가장 가까운 포트를 찾는다(같은 노드 제외). 자석 스냅용.
function findSnapPort(gx, gy, gr){
  let best = null, bestD = SNAP_RADIUS*SNAP_RADIUS;
  document.querySelectorAll(".graph [data-port]").forEach(el=>{
    const node = el.closest(".node")?.dataset.id;
    if(node === wiring.fromNode) return;               // 같은 노드끼리는 연결 불가
    const r = el.getBoundingClientRect();
    const cx = r.left - gr.left + r.width/2, cy = r.top - gr.top + r.height/2;
    const dx = cx-gx, dy = cy-gy, d = dx*dx + dy*dy;
    if(d < bestD){ bestD = d; best = {el, id:el.getAttribute("data-port"), node, x:cx, y:cy}; }
  });
  return best;
}
function clearSnap(){ document.querySelectorAll(".graph .snap").forEach(el=>el.classList.remove("snap")); }

window.addEventListener("mousemove", e=>{
  if(!wiring) return;
  const gr = $("#graph").getBoundingClientRect();
  const gx = e.clientX - gr.left, gy = e.clientY - gr.top;
  clearSnap();
  snapPort = findSnapPort(gx, gy, gr);
  if(snapPort){ snapPort.el.classList.add("snap"); tempPt = {x:snapPort.x, y:snapPort.y}; }  // 착 붙는다
  else tempPt = {x:gx, y:gy};
  drawWires();
});
window.addEventListener("mouseup", e=>{
  if(!wiring) return;
  let toId = null, toNode = null;
  if(snapPort){ toId = snapPort.id; toNode = snapPort.node; }   // 자석으로 붙은 포트 우선
  else {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const portEl = el && el.closest ? el.closest("[data-port]") : null;
    if(portEl){ toId = portEl.getAttribute("data-port"); toNode = portEl.closest(".node")?.dataset.id; }
  }
  if(toId){
    if(toNode === wiring.fromNode){ setStatus("같은 노드끼리는 연결할 수 없습니다"); }
    else if(toId !== wiring.fromId){
      const v = validateConnection(wiring.fromId, toId);
      const A = parsePort(wiring.fromId), B = parsePort(toId);
      const isSensorCcm = (A.kind==="sensor"&&B.kind==="ccm")||(A.kind==="ccm"&&B.kind==="sensor");
      if(!v.ok){ setStatus("⛔ " + v.reason); }
      else if(isSensorCcm){                        // 센서↔자기 CCM = 채널 켜기(재연결)
        const s = A.kind==="sensor" ? A : B;
        setStatus("센서 채널 켜는 중… CCM에 명령 전송");
        setChannel(s.dev, s.key, true).then(()=>{ topoSig=""; refresh();
          setStatus("센서 채널 활성화됨 — 재연결"); }).catch(()=> setStatus("명령 실패"));
      }
      else if(!userWires.some(w=>(w.from===wiring.fromId&&w.to===toId)||(w.from===toId&&w.to===wiring.fromId))){
        userWires.push({id:"w"+(++wireCounter), from:wiring.fromId, to:toId});
        saveWires(); setStatus("연결됨");
      }
    }
  }
  clearSnap();
  wiring = null; tempPt = null; snapPort = null; document.body.style.cursor = "";
  requestAnimationFrame(drawWires);
});

// ── 릴레이 접점 계산 (실제 가스감지기 동작 그대로) ───────────
// 코일 ON/OFF → 접점 상태. NO는 코일 ON에서 닫히고, NC는 코일 ON에서 열린다.
// 고장감지 릴레이(Fail-safe)는 '정상일 때 코일 ON'이라 정전되면 자동으로 고장으로 잡힌다.
// 규칙(제품 요약표 기준)
//   · COM-NO 접점은 '코일이 켜지면 닫힌다' — 항상.
//   · 설정값(NO/NC)은 접점 배선이 아니라 **코일을 어느 쪽으로 구동할지**를 정한다.
//       가스(A/B) 00(NO): 정상 코일 OFF → 경보 시 ON   / 01(NC): 정상 코일 ON → 경보 시 OFF
//       고장(C)  00(NO): 정상 코일 ON  → 고장 시 OFF   / 01(NC): 그 반대
//     C의 00(NO)이 Fail-safe인 이유: 정전되면 코일이 꺼져 자동으로 '고장'으로 잡힌다.
function relayState(relay, rec){
  const v = rec.value;
  const dead = rec.enabled === false || !rec.ok || v === null || v === undefined;
  let event;                       // 이 릴레이가 감시하는 사건이 일어났는가
  if(relay.trigger === "fault"){
    event = dead;                  // 센서 고장·무응답
  }else{
    const sp = relay.setpoint;
    event = (sp !== null && sp !== undefined && v !== null && v !== undefined) ? (v >= sp) : false;
  }
  const nc = (relay.mode === "NC");
  const energized = (relay.trigger === "fault") ? (nc ? event : !event)
                                                : (nc ? !event : event);
  return {energized, closed: energized, bad: event};
}

            `<select class="rmode" data-relay="${escapeHtml(rl.id)}">`+
              `<option value="NO"${rl.mode!=="NC"?" selected":""}>NO</option>`+
              `<option value="NC"${rl.mode==="NC"?" selected":""}>NC</option>`+
            `</select></div>`;
        }).join("") +
        `<div class="insp-manual">NO/NC는 접점의 <b>기본(평소) 상태</b>입니다. `+
          `현장에서 설정한 값으로 바꾸면 위 접점 표시가 그에 맞게 바뀝니다.</div>`
      ) : "")+
      // 센서 전원 제어
      `<div class="insp-sec">센서 제어</div>`+
      `<div class="insp-btnrow">`+
        `<button class="insp-btn ghost" id="sen-restart">↻ 재시작</button>`+
        (r.enabled===false
          ? `<button class="insp-btn" id="sen-toggle">전원 켜기</button>`
          : `<button class="insp-btn danger" id="sen-toggle">전원 끄기</button>`)+
      `</div>`+
      `<button class="insp-btn ghost" id="node-diag" style="margin-top:8px">🩺 자가진단</button>`+
      `<div id="diag-out"></div>`+
      // 활동 기록(로그)
      `<div class="insp-sec">활동 기록</div><div class="evt-list" id="evt-list">불러오는 중…</div>`+
      // 설정 매뉴얼
      (r.manual?`<div class="insp-manual"><span class="mh">제품 설정 안내</span>${escapeHtml(r.manual)}</div>`:"")+
      `<div class="insp-row" style="margin-top:8px"><span class="k">연결</span><span class="v">${r.enabled===false?"⛔ 끊김 (채널 꺼짐)":"RS485 → CCM"}</span></div>`;
  } else if(n.kind==="ccm"){
    const on = n.el.querySelector('[data-role="pill"]')?.textContent==="ON";
    const ports = n.el.querySelectorAll(".prow").length;
    const p = CCM_PRODUCT;
    const ccmPhoto = (p.photo
      ? `<img class="pphoto" src="${escapeHtml(p.photo)}" alt="${escapeHtml(p.product)}" `+
        `onerror="this.remove()" onload="const g=this.parentNode.querySelector('svg'); if(g) g.style.display='none';">`
      : "") + productArt("gateway");
    html += `<div class="insp-kind">${kindKo}</div>`+
      `<div class="insp-photo">${ccmPhoto}</div>`+
      `<div class="insp-brand">${escapeHtml(p.brand)}</div>`+
      `<div class="insp-title">${escapeHtml(p.product)}</div>`+
      `<div class="insp-row"><span class="k">상태</span><span class="v">${on?"온라인":"오프라인"}</span></div>`+
      `<div class="insp-row"><span class="k">시리얼(ID)</span><span class="v">${escapeHtml(title)}</span></div>`+
      `<div class="insp-row"><span class="k">제품 품번</span><span class="v">${escapeHtml(p.part_no)}</span></div>`+
      `<div class="insp-row"><span class="k">연결 센서</span><span class="v">${ports}개</span></div>`+
      `<div class="insp-row"><span class="k">상행 연결</span><span class="v">이더넷 → 판넬</span></div>`+
      `<div class="insp-sec">전원 제어</div>`+
      `<div class="insp-btnrow">`+
        `<button class="insp-btn ghost" id="ccm-restart">↻ 재시작</button>`+
        (clientOff.has(id)
          ? `<button class="insp-btn" id="ccm-poweron">⏻ 전원 켜기</button>`
          : `<button class="insp-btn danger" id="ccm-shutdown">⏻ 전원 끄기</button>`)+
      `</div>`+
      `<button class="insp-btn ghost" id="node-diag" style="margin-top:8px">🩺 자가진단</button>`+
      `<div id="diag-out"></div>`+
      `<div class="insp-sec">활동 기록</div><div class="evt-list" id="evt-list">불러오는 중…</div>`+
      `<div class="insp-manual"><span class="mh">제품 설정 안내</span>${escapeHtml(p.manual)}</div>`;
  } else if(n.kind==="panel"){
    const on = n.el.querySelector('[data-role="pill"]')?.textContent==="ON";
    const ccms = n.el.querySelectorAll(".prow").length;
    html += `<div class="insp-kind">${kindKo}</div>`+
      `<div class="insp-photo">${productArt("panel")}</div>`+
      `<div class="insp-title">${escapeHtml(title)}</div>`+
      `<div class="insp-row"><span class="k">상태</span><span class="v">${on?"온라인":"오프라인"}</span></div>`+
      `<div class="insp-row"><span class="k">CCM 수</span><span class="v">${ccms}대</span></div>`+
      `<div class="insp-row"><span class="k">상행 연결</span><span class="v">MQTT → 클라우드</span></div>`+
      // 판넬 이름은 현장에서 사장님이 직접 붙인다(장비가 보고하는 이름보다 우선)
      `<div class="insp-sec">판넬 이름</div>`+
      `<div class="insp-set"><input class="wide" id="panel-name" type="text" maxlength="60" `+
        `value="${escapeHtml(title)}" placeholder="스마트 판넬"></div>`+
      `<button class="insp-btn" id="panel-name-save">이름 저장</button>`+
      `<div class="insp-manual">현장에 맞는 이름을 적으세요(예: 1공장 배전반, ESS 2호). `+
        `비우고 저장하면 기본 이름으로 돌아갑니다.</div>`;
  } else if(n.user){
    html += `<div class="insp-kind">${kindKo}</div><div class="insp-title">${escapeHtml(title)}</div>`+
      `<div class="insp-row"><span class="k">출처</span><span class="v">사용자 추가</span></div>`+
      `<div class="insp-row"><span class="k">삭제</span><span class="v">Delete · [노드 삭제]</span></div>`;
  } else {
    const sub = n.el.querySelector('[data-role="server-sub"]')?.textContent||"";
    html += `<div class="insp-kind">${kindKo}</div><div class="insp-title">${escapeHtml(title)}</div>`+
      `<div class="insp-row"><span class="k">역할</span><span class="v">텔레메트리 수신</span></div>`+
      `<div class="insp-row"><span class="k">요약</span><span class="v">${escapeHtml(sub)}</span></div>`;
  }

  box.innerHTML = html;
  $("#insp-close").onclick = ()=>{ insp.classList.remove("open");
    nodes.get(selectedId)?.el.classList.remove("sel"); selectedId=null; };

  // 센서 설정 저장 배선
  const saveBtn = $("#set-save");
  if(saveBtn){
    const parts = id.split(":"); const dev=parts[1], key=parts[2];
    const relayModes = ()=>{            // 화면의 NO/NC 선택을 모아 함께 저장
      const m = {};
      document.querySelectorAll("#insp-in .rmode").forEach(s=> m[s.dataset.relay] = s.value);
      return m;
    };
    document.querySelectorAll("#insp-in .rmode").forEach(sel=>{
      sel.onchange = ()=>{
        const modes = relayModes();
        // 로컬 레코드를 먼저 반영해야 다시 그릴 때 새 설정으로 접점이 계산된다
        const rec2 = sensorRec[dev+":"+key];
        if(rec2 && rec2.relays) rec2.relays.forEach(rl=>{ if(modes[rl.id]) rl.mode = modes[rl.id]; });
        setSetting(dev, key, {relay_modes: modes}).then(()=>{
          setStatus("릴레이 설정 저장됨 — 접점 표시 갱신");
          const n2 = nodes.get(id); if(n2) renderInspector(id, n2);   // 접점 상태 다시 계산
        });
      };
    });
    saveBtn.onclick = ()=>{
      const patch = {setpoint: $("#set-sp").value, alarm_max: $("#set-amax").value,
                     alarm_min: $("#set-amin").value, alarm_warn: $("#set-awarn").value,
                     relay_modes: relayModes()};
      saveBtn.textContent = "저장 중…"; saveBtn.disabled = true;
      setSetting(dev, key, patch).then(res=>{
        // 로컬 레코드 즉시 반영(다음 새로고침 전까지)
        const rec = sensorRec[dev+":"+key];
        if(rec){ rec.setpoint=res.setpoint; rec.alarm_min=res.alarm_min;
                 rec.alarm_max=res.alarm_max; rec.alarm_warn=res.alarm_warn; }
        saveBtn.textContent = "저장됨 ✓"; saveBtn.classList.add("saved");
        setStatus("센서 설정 저장 — CCM 알람 기준·셋팅값 적용");
        setTimeout(()=>{ saveBtn.textContent="설정 저장 (CCM 적용)"; saveBtn.classList.remove("saved"); saveBtn.disabled=false; }, 1400);
      }).catch(()=>{ saveBtn.textContent="저장 실패"; saveBtn.disabled=false; });
    };
  }

  // CCM 전원 제어
  if(n.kind==="ccm"){
    const dev = id.split(":")[1];
    const nodeEl = nodes.get(id)?.el;
    const spin = ()=>{ if(nodeEl){ nodeEl.classList.add("restarting");
      setTimeout(()=>nodeEl.classList.remove("restarting"), 3500); } };
    const restart = $("#ccm-restart"), shutdown = $("#ccm-shutdown"), poweron = $("#ccm-poweron");
    if(restart) restart.onclick = ()=>{
      restart.disabled=true; restart.textContent="재시작 중…"; spin();
      clientOff.delete(id); nodeEl && nodeEl.classList.remove("node-off");
      deviceCommand(dev,"restart").then(()=>{ topoSig=""; setStatus(dev+" 재시작 — 재부팅 후 다시 접속합니다"); refresh(); })
        .catch(()=> setStatus("명령 실패")); };
    if(shutdown) shutdown.onclick = ()=>{
      if(!confirm(dev+" 전원을 끕니다. 계속할까요?")) return;
      clientOff.add(id); nodeEl && nodeEl.classList.add("node-off");  // 즉시 '전원 꺼짐' 표시
      deviceCommand(dev,"shutdown").then(()=>{ setStatus(dev+" 전원 꺼짐 — CCM 종료됨"); })
        .catch(()=> setStatus("명령 실패"));
      renderInspector(id, n);   // 버튼을 '전원 켜기'로 갱신
    };
    if(poweron) poweron.onclick = ()=>{   // 데모: 다시 켜기(실기에선 현장 전원 필요)
      clientOff.delete(id); nodeEl && nodeEl.classList.remove("node-off"); spin();
      setStatus(dev+" 재기동 중…"); deviceCommand(dev,"restart").finally(()=>{ topoSig=""; refresh(); renderInspector(id, n); }); };
  }
  // 센서 전원 제어(= 채널 켜기/끄기, CCM에 실제 명령)
  const senRestart = $("#sen-restart"), senToggle = $("#sen-toggle");
  if(senToggle){
    const parts = id.split(":"); const dev=parts[1], key=parts[2];
    const rec = sensorRec[dev+":"+key] || {};
    const isOn = rec.enabled !== false;
    senToggle.onclick = ()=>{
      senToggle.disabled=true; senToggle.textContent="명령 전송…";
      setChannel(dev, key, !isOn).then(()=>{ topoSig="";
        setStatus(isOn ? "센서 채널 끄는 중 — CCM이 이 센서를 멈춥니다" : "센서 채널 켜는 중 — CCM이 폴링을 재개합니다");
        refresh(); }).catch(()=> setStatus("명령 실패")); };
    if(senRestart) senRestart.onclick = ()=>{   // 재시작 = 껐다가 다시 켬(폴링 재초기화)
      senRestart.disabled=true; senRestart.textContent="재시작 중…";
      const sEl = nodes.get(id)?.el;
      if(sEl){ sEl.classList.add("restarting"); setTimeout(()=>sEl.classList.remove("restarting"),3500); }
      setChannel(dev,key,false).then(()=> setChannel(dev,key,true)).then(()=>{ topoSig="";
        setStatus("센서 재시작 — 채널을 껐다 켜 폴링을 재초기화합니다"); refresh(); })
        .catch(()=> setStatus("명령 실패")); };
  }

  // 판넬 이름 변경 저장
  const pnSave = $("#panel-name-save");
  if(pnSave){
    const panelId = id.slice("panel:".length);
    const doSave = ()=>{
      const v = ($("#panel-name").value || "").trim();
      pnSave.disabled = true; pnSave.textContent = "저장 중…";
      fetch("/api/panel/name",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({panel:panelId, name:v})}).then(r=>r.json()).then(()=>{
          topoSig = ""; refresh();           // 노드 제목을 새 이름으로 다시 그린다
          setStatus("판넬 이름 변경됨 — " + (v || "기본 이름으로 복귀"));
          pnSave.textContent = "저장됨 ✓"; pnSave.classList.add("saved");
          setTimeout(()=>{ pnSave.textContent="이름 저장"; pnSave.classList.remove("saved");
                           pnSave.disabled=false; }, 1300);
        }).catch(()=>{ pnSave.textContent="저장 실패"; pnSave.disabled=false; });
    };
    pnSave.onclick = doSave;
    $("#panel-name").onkeydown = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); doSave(); } };
  }

  // 자가진단 + 활동 기록 (센서·CCM 공통)
  if(n.kind==="sensor" || n.kind==="ccm"){
    const parts = id.split(":");
    const dev = parts[1];
    const key = n.kind==="sensor" ? parts[2] : "";
    loadEvents(dev, key);
    const diagBtn = $("#node-diag");
    if(diagBtn) diagBtn.onclick = ()=> runDiagnose(dev, key, diagBtn);
  }
  insp.classList.add("open");
}

// ── 사용자 노드 (팔레트에서 추가) ─────────────────────
function addUserNode(kind){
  userCounter++;
  const id = "user:"+kind+":"+userCounter;
  userNodes.push({id, kind, name: KIND_KO[kind]+" "+userCounter});
  // 지금 보고 있는 화면 중앙 근처에 놓는다(스크롤된 위치 반영) + 겹침 방지 캐스케이드
  const cv = $("#canvas");
  const cx = cv.scrollLeft + Math.max(40, cv.clientWidth/2 - 80);
  const cy = cv.scrollTop  + Math.max(40, cv.clientHeight/2 - 80);
  nodePos[id] = {x: Math.round(cx + (userCounter%5)*22), y: Math.round(cy + (userCounter%5)*22)};
  saveUser(); savePos(nodePos);
  renderUserNodes(); select(id);
  requestAnimationFrame(drawWires);
  setStatus(KIND_KO[kind]+" 노드 추가됨 — 화면 중앙에 배치");
}
function mkUserNode(rec){
  const el = document.createElement("div");
  el.className = "node usernode "+rec.kind; el.dataset.id = rec.id;
  const port = KIND_PORT[rec.kind]||"data";
  el.innerHTML =
    `<div class="nhead"><span class="ntitle">${escapeHtml(rec.name)}</span><span class="nkind">${KIND_TAG[rec.kind]||""}</span></div>`+
    `<div class="nbody"><div class="prow">`+
      `<span class="port in ${port}" data-port="uin:${cssAttr(rec.id)}"></span>`+
      `<span class="pname">입력 / 출력</span>`+
      `<span class="port out ${port}" data-port="uout:${cssAttr(rec.id)}"></span>`+
    `</div><div class="nsub">사용자 노드 · ${KIND_KO[rec.kind]}</div></div>`;
  makeDraggable(el);
  el.addEventListener("mousedown", ()=>select(rec.id), true);
  return el;
}
function renderUserNodes(){
  const graph = $("#graph");
  graph.querySelectorAll(".node.usernode").forEach(n=>{ nodes.delete(n.dataset.id); n.remove(); });
  for(const rec of userNodes){
    const el = mkUserNode(rec); graph.appendChild(el);
    nodes.set(rec.id, {el, kind:rec.kind, user:true});
  }
  applyPositions();
}
function deleteSelected(){
  // 연결이 선택돼 있으면 연결부터 끊는다
  if(selectedWireId){
    if(selectedWireId.startsWith("auto:")){        // 실제 배선
      const [fromId, toId] = selectedWireId.slice(5).split("|");
      const A = parsePort(fromId), B = parsePort(toId);
      const pair = [A.kind, B.kind].sort().join("-");
      if(pair === "ccm-sensor"){                   // 센서 채널 → CCM에 "끄기" 명령
        const s = A.kind==="sensor" ? A : B;
        selectedWireId = null;
        setStatus("센서 채널 끄는 중… CCM에 명령 전송");
        setChannel(s.dev, s.key, false).then(()=>{ topoSig=""; refresh();
          setStatus("센서 채널 비활성화됨 — CCM이 이 센서를 멈춥니다"); })
          .catch(()=> setStatus("명령 실패"));
        return;
      }
      // CCM↔판넬·판넬↔클라우드는 구조 연결이라 임의로 못 끊는다
      selectedWireId = null; requestAnimationFrame(drawWires);
      setStatus("⛔ 구조 연결(CCM↔판넬·판넬↔클라우드)은 끊을 수 없습니다 — 센서 채널만 끌 수 있습니다");
      return;
    }
    userWires = userWires.filter(w=>w.id!==selectedWireId);   // 직접 그린 연결 → 삭제
    selectedWireId = null; saveWires();
    requestAnimationFrame(drawWires); setStatus("연결 삭제됨"); return;
  }
  if(!selectedId || !selectedId.startsWith("user:")){ setStatus("삭제할 사용자 노드/연결을 먼저 선택하세요"); return; }
  // 이 노드에 물린 사용자 배선도 함께 제거
  const pin = "uin:"+cssAttr(selectedId), pout = "uout:"+cssAttr(selectedId);
  userWires = userWires.filter(w=> w.from!==pin && w.to!==pin && w.from!==pout && w.to!==pout);
  userNodes = userNodes.filter(n=>n.id!==selectedId);
  delete nodePos[selectedId];
  nodes.get(selectedId)?.el.remove(); nodes.delete(selectedId);
  saveUser(); savePos(nodePos); saveWires();
  $("#inspector").classList.remove("open"); selectedId = null;
  requestAnimationFrame(drawWires); setStatus("노드 삭제됨");
}

// ── 상태표시 ──────────────────────────────────────────
let statusTimer;
function setStatus(t){ const s=$("#status"); if(!s) return; s.textContent=t;
  clearTimeout(statusTimer); statusTimer=setTimeout(()=>s.textContent="",2600); }

// ── macOS 메뉴바 ──────────────────────────────────────
let openMenu = null;
function openMB(m){
  if(openMenu && openMenu!==m) closeMB();
  m.classList.add("open"); m.querySelector(".mb-dd").hidden = false; openMenu = m;
}
function closeMB(){
  if(openMenu){ openMenu.classList.remove("open"); openMenu.querySelector(".mb-dd").hidden = true; openMenu = null; }
}
document.querySelectorAll(".mb-menu").forEach(m=>{
  const title = m.querySelector(".mb-title");
  title.addEventListener("click", e=>{ e.stopPropagation(); openMenu===m ? closeMB() : openMB(m); });
  title.addEventListener("mouseenter", ()=>{ if(openMenu && openMenu!==m) openMB(m); }); // macOS 메뉴 전환
});
document.addEventListener("click", e=>{ if(openMenu && !e.target.closest(".mb-menu")) closeMB(); });
// 메뉴 항목 클릭 시 메뉴 닫힘 (개별 동작은 각 버튼 핸들러가 처리)
document.querySelectorAll(".mb-dd .mb-item").forEach(b=> b.addEventListener("click", ()=> closeMB()));
// 노드 추가 항목
document.querySelectorAll(".mb-item[data-add]").forEach(b=>{ b.onclick = ()=>addUserNode(b.dataset.add); });
$("#btn-new").onclick = ()=>{
  if((userNodes.length||userWires.length) && !confirm("추가한 노드·연결을 모두 지울까요? (현장 실시간 노드는 유지됩니다)")) return;
  userNodes.forEach(n=>{ nodes.get(n.id)?.el.remove(); nodes.delete(n.id); delete nodePos[n.id]; });
  userNodes = []; userWires = []; selectedWireId = null;
  saveUser(); saveWires(); savePos(nodePos);
  $("#inspector").classList.remove("open"); selectedId=null;
  requestAnimationFrame(drawWires); setStatus("새 구성");
};
$("#btn-open").onclick = ()=>{ userNodes=loadUser(); userWires=loadWires(); nodePos=loadPos(); renderUserNodes();
  requestAnimationFrame(drawWires); setStatus("불러옴"); };
$("#btn-save").onclick = ()=>{ saveUser(); saveWires(); savePos(nodePos); setStatus("저장됨 ✓"); };
$("#btn-saveas").onclick = ()=>{ const name=prompt("구성 이름 메모","기본 구성");
  if(name!==null){ saveUser(); saveWires(); savePos(nodePos); setStatus("저장됨: "+name); } };
$("#btn-delete").onclick = deleteSelected;
$("#btn-restore").onclick = ()=>{ setStatus("꺼진 센서 채널 모두 켜는 중…");
  enableAllChannels().then(d=>{ topoSig=""; refresh();
    setStatus(d.enabled?`센서 채널 ${d.enabled}개 다시 켬`:"꺼진 센서가 없습니다"); })
    .catch(()=> setStatus("명령 실패")); };
$("#btn-arrange").onclick = ()=>{ // 현장 노드만 자동정렬, 사용자 노드 배치는 보존
  for(const id of Object.keys(nodePos)){ if(!id.startsWith("user:")) delete nodePos[id]; }
  savePos(nodePos); applyPositions(); requestAnimationFrame(drawWires); setStatus("자동 정렬"); };
$("#btn-run").onclick = ()=>{ setStatus("실행 — 데이터 갱신 중"); refresh(); };
// 알림(카카오 알림톡·문자) 연결 확인 — 운영자가 직접 누를 때만 실제 발송된다
$("#btn-notify-test").onclick = ()=>{

    if(!d.ok){ setStatus("⛔ "+(d.error||"발송 실패")); return; }
    const okCh = (d.result||[]).filter(r=>r.ok).map(r=>r.channel);

                          : "발송 시도됨(응답 확인 필요) — "+(d.channels||[]).join(", "));

$("#btn-discover").onclick = ()=>{
  const b = $("#btn-discover"); if(b.classList.contains("busy")) return;
  b.classList.add("busy"); setStatus("센서 버스 탐색 중… 물려 있는 장비를 식별합니다");
  fetch("/api/discover",{method:"POST"}).then(r=>r.json()).then(d=>{

window.addEventListener("keydown", e=>{
  const editable = /^(input|textarea)$/i.test(e.target.tagName);
  const canDelete = selectedWireId || (selectedId && selectedId.startsWith("user:"));
  if((e.key==="Delete"||e.key==="Backspace") && canDelete && !editable){ e.preventDefault(); deleteSelected(); }
});

// ── 테마 (라이트/다크) ────────────────────────────────
const LS_THEME = "jcc-theme";
function currentTheme(){
  const set = document.documentElement.getAttribute("data-theme");
  if(set) return set;   // 명시 선택
  return matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const b = $("#btn-theme"); if(b) b.textContent = t==="dark" ? "☀️" : "🌙";
  try{ localStorage.setItem(LS_THEME, t); }catch(e){}
  requestAnimationFrame(drawWires);   // 색 바뀌면 배선 다시(색 캐시 방지)
}
(function initTheme(){
  let t; try{ t = localStorage.getItem(LS_THEME); }catch(e){}
  applyTheme(t || currentTheme());
})();
$("#btn-theme").onclick = ()=> applyTheme(currentTheme()==="dark" ? "light" : "dark");

// ── 하단 실시간 로그 스트립 (알람·특이사항 3줄) ─────────
function loadTicker(){
  const el = $("#ticker"); if(!el) return;
  fetch("/api/events?limit=6",{cache:"no-store"}).then(r=>r.json()).then(d=>{
    const evs = (d.events||[]).slice(0,3);
    const prevTop = el.firstChild ? el.firstChild.dataset.k : "";
    el.innerHTML = evs.map((e,i)=>{
      const m = EVENT_META[e.etype] || {label:e.etype, dot:"info", ic:"•"};
      const cls = (e.etype==="alarm"||e.etype==="silent") ? "alarm" :
                  (e.etype==="alarm_warn") ? "warn" :
                  (e.etype==="alarm_clear"||e.etype==="recovered"||e.etype==="stuck_clear"||e.etype==="anomaly_clear") ? "clear" :
                  (m.dot==="crit"||m.dot==="warn") ? "warn" : "info";
      const dev = e.device_id ? e.device_id+" · " : "";
      const txt = e.detail || m.label;
      const k = e.ts+"|"+e.etype+"|"+(e.sensor_key||"");
      const isNew = i===0 && k!==prevTop;
      return `<div class="tk ${cls} ${isNew?"newest":""}" data-k="${k}">`+
             `<span class="tt">${ago(e.ts)||"방금"}</span>`+
             `<span class="ic">${m.ic||"•"}</span>`+
             `<span class="tm">${escapeHtml(dev+txt)}</span></div>`;
    }).join("");
  }).catch(()=>{});
}

// ── 활성 경보 패널 (🔔) ───────────────────────────────
let alarmPanelOpen = false;
function loadAlarms(){
  fetch("/api/alarms",{cache:"no-store"}).then(r=>r.json()).then(d=>{
    const al = d.alarms||[];
    const badge = $("#bell-badge"), bell = $("#btn-bell");
    if(al.length){ badge.textContent = al.length; badge.hidden = false; bell.classList.add("has-alarms"); }
    else { badge.hidden = true; bell.classList.remove("has-alarms"); }
    const cnt = $("#ap-count"); if(cnt) cnt.textContent = al.length;
    if(!alarmPanelOpen) return;                 // 열려있을 때만 목록 렌더
    const list = $("#ap-list");
    if(!al.length){ list.innerHTML = `<div class="ap-empty">활성 경보 없음 — 정상 ✓</div>`; return; }
    list.innerHTML = al.map(a=>{
      const m = EVENT_META[a.kind] || {ic:"⚠"};
      const crit = a.severity==="crit";
      const acked = !!a.acked_at;
      return `<div class="ap-item"><span class="apd ${crit?'crit':''}"></span>`+
        `<div class="apbody"><div class="aptext">${m.ic||"⚠"} ${escapeHtml(a.detail||a.kind)}</div>`+
        `<div class="apmeta">${escapeHtml(a.device_id||"")}${a.sensor_key?" · "+escapeHtml(a.sensor_key):""} · ${ago(a.raised_at)||"방금"}`+
        `${a.escalated_at?` · <span class="apesc">⬆ 상향됨</span>`:""}${acked?` · 확인:${escapeHtml(a.acked_by||"")}`:""}</div></div>`+
        (acked ? `<button class="ap-ack done">확인됨</button>` : `<button class="ap-ack" data-ack="${a.id}">확인</button>`)+
        `</div>`;
    }).join("");
    list.querySelectorAll("[data-ack]").forEach(b=> b.onclick = ()=> ackAlarm(+b.dataset.ack));
  }).catch(()=>{});
}
function ackAlarm(id){
  fetch("/api/alarm/ack",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({alarm_id:id, by:"operator"})}).then(()=>{ setStatus("경보 확인됨"); loadAlarms(); });
}
$("#btn-bell").onclick = (e)=>{ e.stopPropagation();
  alarmPanelOpen = !alarmPanelOpen; $("#alarm-panel").hidden = !alarmPanelOpen; loadAlarms(); };
document.addEventListener("click", (e)=>{
  if(alarmPanelOpen && !e.target.closest("#alarm-panel") && !e.target.closest("#btn-bell")){
    alarmPanelOpen = false; $("#alarm-panel").hidden = true; } });

function tick(){ const d=new Date();
  $("#clock").textContent = d.toLocaleTimeString("ko-KR",{hour12:false}); }

// ── 이력 차트 (외부 라이브러리 없음) ───────────────────
async function openChart(deviceId, sensor, name, unit){
  $("#chart-title").textContent = `${name} — ${deviceId}`;
  $("#overlay").classList.add("open");
  try{ const res = await fetch(`/api/devices/${encodeURIComponent(deviceId)}/history?sensor=${encodeURIComponent(sensor)}&limit=200`,{cache:"no-store"});
    drawChart((await res.json()).points||[], unit);
  }catch(e){ drawChart([], unit); }
}
$("#close-chart").onclick = ()=>$("#overlay").classList.remove("open");
$("#overlay").onclick = e=>{ if(e.target===$("#overlay")) $("#overlay").classList.remove("open"); };
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function drawChart(points, unit){
  const cv=$("#chart"), ctx=cv.getContext("2d"), W=cv.width, H=cv.height, pad={l:52,r:16,t:16,b:28};
  ctx.clearRect(0,0,W,H);
  const ink3=cssVar("--ink-3"),rule=cssVar("--rule"),accent=cssVar("--accent");
  const vals=points.filter(p=>p.ok&&p.value!==null).map(p=>p.value), stats=$("#chart-stats");
  if(vals.length<1){ ctx.fillStyle=ink3; ctx.font="14px sans-serif"; ctx.fillText("이력 데이터가 없습니다.",pad.l,H/2); stats.innerHTML=""; return; }
  let min=Math.min(...vals),max=Math.max(...vals); if(min===max){min-=1;max+=1;}
  const pth=(max-min)*0.12; min-=pth; max+=pth;
  const x=i=>pad.l+(W-pad.l-pad.r)*(points.length<=1?0:i/(points.length-1));
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-min)/(max-min));
  ctx.strokeStyle=rule; ctx.fillStyle=ink3; ctx.font="11px monospace"; ctx.lineWidth=1;
  for(let g=0;g<=4;g++){ const val=min+(max-min)*g/4,yy=y(val);
    ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(W-pad.r,yy); ctx.stroke();
    ctx.fillText((Math.round(val*100)/100).toString(),6,yy+4); }
  ctx.beginPath();
  points.forEach((p,i)=>{ const v=(p.ok&&p.value!==null)?p.value:null; if(v===null)return;
    const xx=x(i),yy=y(v); i===0?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy); });
  ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();
  const li=points.length-1, lv=points[li].value;
  if(lv!==null){ ctx.beginPath(); ctx.arc(x(li),y(lv),3.5,0,7); ctx.fillStyle=accent; ctx.fill(); }
  const cur=vals[vals.length-1];
  stats.innerHTML=`<span>현재 <b>${fmtValue(cur)} ${escapeHtml(unit)}</b></span>`+
    `<span>최소 <b>${fmtValue(Math.min(...vals))}</b></span>`+
    `<span>최대 <b>${fmtValue(Math.max(...vals))}</b></span>`+
    `<span>표본 <b>${vals.length}</b></span>`;
}

renderUserNodes();   // 데이터 도착 전에도 저장된 사용자 노드를 먼저 표시
refresh(); setInterval(refresh, REFRESH_MS);

loadAlarms(); setInterval(loadAlarms, 3000);   // 활성 경보 벨/패널
</script>
