# Render 배포 청사진(Blueprint). Render 대시보드에서 이 저장소를 연결하면
# 이 파일을 읽어 서버를 자동으로 띄운다. (New + → Blueprint → 이 repo 선택)
#
# 우리 서버는 파이썬 표준 라이브러리만 쓰므로 설치할 의존성이 없다.
# 무료 플랜은 일정 시간 미사용 시 잠들고, 디스크가 재배포 때 초기화된다
# (검토용으로는 충분 — [AI 자동연결] 누르면 토폴로지가 다시 생성된다).
services:
  - type: web
    name: jcc-ccm
    runtime: python
    plan: free
    rootDir: server
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m jcc_server"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONUTF8
        value: "1"
